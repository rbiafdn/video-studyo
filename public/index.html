<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Stüdyo</title>
<style>
  :root {
    --bg: #0b0c10; --panel: #13151b; --panel2: #191c24; --line: #262a35; --line2: #343948;
    --ink: #e8e9ee; --muted: #8b90a0; --faint: #5d6270;
    --gold: #e6b84a; --gold2: #f3cc6a; --gold-ink: #1a1405;
    --ok: #3ddc84; --warn: #f0b24a; --err: #ff6b6b; --off: #3a3f4c; --blue: #6ea8ff; --purple: #b38cff; --teal: #4fd1c5;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.45; }
  a { color: var(--gold); text-decoration: none; } a:hover { text-decoration: underline; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; } h2 { font-size: 17px; margin: 0 0 12px; font-weight: 700; } h3 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
  p { margin: 6px 0; } .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; }
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 22px; padding: 0 28px; height: 54px; background: rgba(11,12,16,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; letter-spacing: .08em; font-size: 15px; white-space: nowrap; } .brand span { color: var(--gold); }
  .tabs { display: flex; gap: 4px; } .tabs a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 13px; } .tabs a.on { background: var(--panel2); color: var(--ink); }
  .top nav { flex: 1; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .top nav a { color: var(--muted); }
  .top .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: var(--muted); }
  .status-row { display: flex; gap: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--off); margin-right: 5px; vertical-align: middle; } .dot.on { background: var(--ok); }
  main { padding: 22px 28px 60px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .page-head .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .crumb { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; align-items: start; }
  .grid-setup { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  .grid-lib { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; align-items: start; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: relative; transition: border-color .15s; }
  .card.link { cursor: pointer; } .card.link:hover { border-color: var(--line2); }
  .card .title { font-weight: 600; font-size: 15px; margin-bottom: 4px; padding-right: 50px; } .card .sub { color: var(--muted); font-size: 12.5px; }
  .card .del { position: absolute; top: 10px; right: 10px; }
  .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); vertical-align: middle; white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: #1f5a3a; } .chip.err { color: var(--err); border-color: #6a2a2a; } .chip.gold { color: var(--gold); border-color: #6a541f; }
  .chip.t-avatar { color: var(--blue); border-color: #2d3f63; } .chip.t-gemini, .chip.t-flow { color: var(--warn); border-color: #5a4420; } .chip.t-seedance { color: var(--purple); border-color: #4a3870; } .chip.t-text_card { color: var(--teal); border-color: #1f5a55; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; } label.f:first-child { margin-top: 0; }
  input[type=text], input[type=number], textarea, select { width: 100%; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); }
  textarea { min-height: 70px; resize: vertical; } textarea.tall { min-height: 280px; } textarea.sm { min-height: 44px; padding: 6px 9px; font-size: 13px; }
  input.sm, select.sm { padding: 6px 8px; font-size: 12.5px; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .mt { margin-top: 14px; }
  .check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; } .check input { accent-color: var(--gold); }
  details.set { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-top: 14px; }
  details.set summary { cursor: pointer; padding: 12px 18px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.set summary::after { content: "▾"; color: var(--muted); } details.set[open] summary::after { content: "▴"; } details.set .body { padding: 0 18px 18px; }
  button, .btn { font: inherit; font-size: 13.5px; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line2); background: var(--panel2); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover, .btn:hover { border-color: #4a5063; text-decoration: none; }
  button.gold, .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; } button.gold:hover, .btn.gold:hover { background: var(--gold2); }
  button.ghost { background: transparent; } button.danger { color: var(--err); }
  button.xs, .btn.xs { font-size: 12px; padding: 5px 9px; border-radius: 7px; } button.big { font-size: 15px; padding: 12px 20px; }
  button:disabled, .btn.dis { opacity: .4; cursor: not-allowed; }
  .act { display: inline-flex; flex-direction: column; gap: 3px; } .est { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .err { color: var(--err); font-size: 13px; white-space: pre-wrap; }
  .warnbox { background: #2a2210; border: 1px solid #6a541f; border-radius: var(--r); padding: 12px 18px; margin-bottom: 14px; }
  .warnbox summary { cursor: pointer; color: var(--gold); font-weight: 600; } .warnbox li { margin: 3px 0; }
  .progress { height: 6px; background: var(--panel2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); } .progress i { display: block; height: 100%; background: var(--gold); } .progress i.over { background: var(--err); }
  /* adımlar */
  .steps { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .steps button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--muted); padding: 10px 16px; font-size: 14px; }
  .steps button.on { color: var(--gold); border-bottom-color: var(--gold); } .steps button b { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--panel2); color: var(--ink); font-size: 12px; line-height: 20px; text-align: center; margin-right: 6px; } .steps button.on b { background: var(--gold); color: var(--gold-ink); }
  /* çekim kartı */
  .section { margin: 18px 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .section b { font-size: 15px; }
  .shot { display: grid; grid-template-columns: 170px minmax(0, 1fr) 250px; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .shot.busy { border-color: #6a541f; }
  .shot .thumb { width: 100%; aspect-ratio: 16 / 9; background: #0f1116; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12px; }
  .shot .thumb.v { aspect-ratio: 9 / 16; max-height: 300px; } .shot .thumb.sq { aspect-ratio: 1 / 1; } .shot .thumb img, .shot .thumb video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .shot .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); } .shot .head b { color: var(--ink); font-size: 15px; }
  .shot .lines { margin-top: 8px; display: grid; gap: 6px; }
  .line { display: grid; grid-template-columns: 110px minmax(0, 1fr) 120px; gap: 8px; align-items: center; font-size: 13px; }
  .line .who { color: var(--muted); font-size: 12px; } .line.vo .who { color: var(--purple); } .line.txt .who { color: var(--teal); }
  .shot .side { display: flex; flex-direction: column; gap: 8px; }
  .shot .side .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .shot .note { border: 1px dashed var(--line2); border-radius: 9px; padding: 8px; }
  .shot .note textarea { min-height: 46px; }
  .shot .adv { grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .adv .full { grid-column: 1 / -1; }
  .audio-row { display: grid; grid-template-columns: 90px 130px minmax(0, 1fr) 180px 40px; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; margin-bottom: 12px; }
  .photos { display: flex; gap: 6px; flex-wrap: wrap; } .photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; } .photos .add { width: 56px; height: 56px; border: 1px dashed var(--line2); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 11px; cursor: pointer; }
  .lib-item { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; } .lib-item.used { border-color: #6a541f; }
  .lib-item .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .lib-item .full { grid-column: 1 / -1; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line2); border-top-color: var(--gold); border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -2px; } @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #22252e; border: 1px solid var(--line2); color: var(--ink); padding: 10px 16px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 50; } .toast.show { opacity: 1; }
  .empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }
  @media (max-width: 1100px) { .grid-2, .grid-setup { grid-template-columns: 1fr; } .shot { grid-template-columns: 140px 1fr; } .shot .side { grid-column: 1 / -1; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">VİDEO <span>STÜDYO</span></div>
  <div class="tabs"><a href="#/" id="tab-videos">Videolar</a><a href="#/lib" id="tab-lib">Kütüphane</a></div>
  <nav id="crumbs"></nav>
  <div class="right"><div class="status-row" id="status-row">Durum yükleniyor…</div><div id="balance-row"></div></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const S = { status: null, prices: null, voices: null, voicesError: null, settings: null, lib: null, looks: [], videos: [], video: null, step: null, openAdv: new Set(), drafts: {}, timer: null, lastJson: '', view: '' };
  const SERVICE = { claude: 'Claude', gemini: 'Gemini', elevenlabs: 'ElevenLabs', fal: 'fal.ai', flow: 'Dış araç', ffmpeg: 'ffmpeg' };
  const TOOL_NAMES = { avatar: 'Avatar (fal.ai)', gemini: 'Gemini (otomatik)', flow: 'Dış araç (elle)', seedance: 'Seedance (fal.ai)', text_card: 'Yazı kartı (ffmpeg)' };
  const ASPECTS = { '9:16': '9:16 dikey (Shorts, Reels)', '16:9': '16:9 yatay (YouTube, TV)', '1:1': '1:1 kare' };

  // ---------- yardımcılar ----------
  async function api(path, opts) {
    const o = Object.assign({ headers: {} }, opts || {});
    if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers['Content-Type'] = 'application/json'; delete o.json; }
    const res = await fetch(path, o);
    let data = null; try { data = await res.json(); } catch { data = null; }
    if (!res.ok) { const e = new Error((data && (data.error || data.message)) || ('İstek başarısız (' + res.status + ')')); e.status = res.status; e.data = data; throw e; }
    return data;
  }
  async function apiConfirm(path, json) {
    try { return await api(path, { method: 'POST', json: json || {} }); }
    catch (e) {
      if (e.status === 409 && e.data && e.data.needsConfirm) { if (!window.confirm(e.data.message)) throw new Error('İşlem iptal edildi.'); return api(path, { method: 'POST', json: Object.assign({}, json || {}, { confirmed: true }) }); }
      throw e;
    }
  }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); }
  const fmtUsd = (n) => { n = Number(n) || 0; return n === 0 ? '$0.00' : n < 0.01 ? '$' + n.toFixed(3) : '$' + n.toFixed(2); };
  const fmtNum = (n) => (Number(n) || 0).toLocaleString('tr-TR');
  const fmtDate = (s) => new Date(s).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' });
  const fmtDur = (sec) => { sec = Math.round(sec || 0); return sec >= 60 ? Math.floor(sec / 60) + ' dk ' + (sec % 60) + ' sn' : sec + ' sn'; };
  const fmtT = (sec) => { sec = Math.max(0, Number(sec) || 0); const m = Math.floor(sec / 60), s = sec - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
  const keyMissing = (k) => !(S.status && S.status.keys && S.status.keys[k]);
  function missingReason(list) { const names = { anthropic: 'ANTHROPIC_API_KEY', gemini: 'GEMINI_API_KEY', elevenlabs: 'ELEVENLABS_API_KEY', fal: 'FAL_KEY' }; const miss = list.filter(keyMissing).map((k) => names[k]); return miss.length ? 'Eksik anahtar: ' + miss.join(', ') : ''; }
  function isEditing() { const el = document.activeElement; return el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.tagName === 'SELECT'); }
  const vFile = (name, stamp, dl) => `/files/v/${S.video.id}/${name}?v=${stamp || 0}${dl ? '&download=1' : ''}`;
  const nn = (id) => String(id).padStart(2, '0');
  function estLabel(item) {
    if (!item) return '';
    if (item.servis === 'flow') return 'dış araçta üretilir';
    if (item.servis === 'ffmpeg') return 'ücretsiz';
    if (item.servis === 'elevenlabs') return item.karakter != null ? '≈ ' + fmtNum(item.karakter) + ' karakter · ElevenLabs' : '≈ ' + fmtNum(item.kredi) + ' kredi · ElevenLabs';
    return '≈ ' + fmtUsd(item.usd) + ' · ' + (SERVICE[item.servis] || item.servis);
  }
  function estTotal(t) { if (!t) return ''; const parts = []; if (t.usd > 0) parts.push('≈ ' + fmtUsd(t.usd)); if (t.kredi > 0) parts.push(fmtNum(t.kredi) + ' kredi'); return parts.length ? parts.join(' + ') : '≈ $0.00'; }
  function spent(m) {
    if (!m) return fmtUsd(0);
    const parts = [];
    for (const k of ['claude', 'gemini', 'fal']) { const s = m.servisler[k]; if (s && s.usd > 0) parts.push(SERVICE[k] + ' ' + fmtUsd(s.usd)); }
    const el = m.servisler.elevenlabs; if (el && el.kredi > 0) parts.push('ElevenLabs ' + fmtNum(el.kredi) + ' kredi' + (el.usd > 0 ? ' (≈ ' + fmtUsd(el.usd) + ')' : ''));
    return fmtUsd(m.toplam_usd) + (parts.length ? ' (' + parts.join(' · ') + ')' : '');
  }
  function voiceSelect(attrs, value, cls) {
    if (!S.voices) return `<input type="text" class="${cls || ''}" ${attrs} value="${esc(value || '')}" placeholder="ElevenLabs ses ID">`;
    const opts = ['<option value="">— ses yok (klibin kendi sesi) —</option>'].concat(S.voices.map((v) => { const lab = [v.labels && v.labels.gender, v.labels && v.labels.accent].filter(Boolean).join(', '); const paid = v.category && v.category !== 'premade' ? ' · ücretli plan' : ''; return `<option value="${esc(v.voice_id)}" ${v.voice_id === value ? 'selected' : ''}>${esc(v.name)}${lab ? ' (' + esc(lab) + ')' : ''}${paid}</option>`; }));
    if (value && !S.voices.some((v) => v.voice_id === value)) opts.push(`<option value="${esc(value)}" selected>${esc(value)}</option>`);
    return `<select class="${cls || ''}" ${attrs}>${opts.join('')}</select>`;
  }
  function statusChip(st) { const cls = st === 'Hazır' ? 'ok' : /hata/i.test(st) ? 'err' : /bekleniyor|Onay/i.test(st) ? 'gold' : ''; return `<span class="chip ${cls}">${/Planlanıyor|Üretiliyor|üretiliyor|başlatılıyor|çevriliyor|ayrılıyor|yumuşatılıyor|indiriliyor|klibe ekleniyor/.test(st) ? '<span class="spin"></span> ' : ''}${esc(st)}</span>`; }
  const toolChip = (t) => `<span class="chip t-${esc(t)}">${esc(TOOL_NAMES[t] || t)}</span>`;
  const toolSelect = (attrs, value) => `<select class="sm" ${attrs} style="width:auto">${Object.entries(TOOL_NAMES).map(([k, v]) => `<option value="${k}" ${k === value ? 'selected' : ''}>${v}</option>`).join('')}</select>`;

  // ---------- üst çubuk ----------
  async function loadStatus() {
    try { S.status = await api('/api/status'); } catch { $('status-row').textContent = 'Sunucuya ulaşılamıyor'; return; }
    const k = S.status.keys, m = S.status.models;
    const it = (ok, label, title) => `<span title="${esc(title)}"><span class="dot ${ok ? 'on' : ''}"></span>${label}</span>`;
    $('status-row').innerHTML = it(k.anthropic, 'Claude', m.claude + ' / zor: ' + m.claudeHard) + it(k.gemini, 'Gemini', 'Görsel: ' + m.image + ' · Video: ' + m.video) + it(k.elevenlabs, 'ElevenLabs', 'Diyalog: ' + m.dialogue + ' · Dış ses: ' + m.tts + ' · Müzik: ' + m.music + ' · SFX: ' + m.sfx) + it(k.fal, 'fal.ai', 'Avatar: ' + m.avatar + ' · Seedance: ' + m.seedance) + it(S.status.ffmpeg, 'ffmpeg', 'ffmpeg-static');
    loadBalances();
    if (!S.prices) { try { S.prices = await api('/api/prices'); } catch { /* sessiz */ } }
  }
  async function loadBalances() {
    try {
      const b = await api('/api/balances'); const parts = [];
      if (b.elevenlabs) parts.push(`ElevenLabs kalan: <b>${fmtNum(b.elevenlabs.remaining)}</b> / ${fmtNum(b.elevenlabs.limit)} kredi`);
      const L = b.links || {};
      parts.push(`Bakiye: <a href="${esc(L.anthropic)}" target="_blank" rel="noopener">Anthropic</a> · <a href="${esc(L.gemini)}" target="_blank" rel="noopener">Google</a> · <a href="${esc(L.fal)}" target="_blank" rel="noopener">fal.ai</a>${b.elevenlabs ? '' : ' · <a href="' + esc(L.elevenlabs) + '" target="_blank" rel="noopener">ElevenLabs</a>'}`);
      $('balance-row').innerHTML = parts.join(' &nbsp;·&nbsp; ');
    } catch { /* sessiz */ }
  }
  async function loadVoices() { if (S.voices) return; if (keyMissing('elevenlabs')) { S.voicesError = 'ELEVENLABS_API_KEY tanımlı değil.'; return; } try { S.voices = await api('/api/voices'); S.voicesError = null; } catch (e) { S.voicesError = e.message; } }
  async function loadBase() { [S.settings, S.lib, S.looks] = await Promise.all([api('/api/settings'), api('/api/library'), api('/api/looks').catch(() => [])]); await loadVoices(); }
  function crumbs(items) { $('crumbs').innerHTML = items.map((c, i) => (c.href && i < items.length - 1) ? `<a href="${c.href}">${esc(c.label)}</a>` : `<span>${esc(c.label)}</span>`).join(' <span class="faint">/</span> '); }

  // ---------- yönlendirme ----------
  function stopPoll() { if (S.timer) clearInterval(S.timer); S.timer = null; }
  function route() {
    stopPoll();
    const h = location.hash.replace(/^#/, '') || '/';
    $('tab-videos').classList.toggle('on', !h.startsWith('/lib'));
    $('tab-lib').classList.toggle('on', h.startsWith('/lib'));
    const m = h.match(/^\/v\/([\w-]+)(?:\/(setup|shots|final))?$/);
    if (m) return viewVideo(m[1], m[2]);
    if (h.startsWith('/lib')) return viewLibrary();
    return viewHome();
  }
  window.addEventListener('hashchange', route);

  // ---------- ANA SAYFA ----------
  async function viewHome() {
    S.view = 'home'; crumbs([{ label: 'Videolar' }]);
    try { await loadBase(); S.videos = await api('/api/videos'); } catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    const st = S.settings, r = missingReason(['anthropic']);
    app.innerHTML = `
      <div class="grid-2">
        <section><h2>Videolar</h2><div class="cards" id="video-cards"></div></section>
        <aside>
          <div class="panel">
            <h3>Yeni video</h3>

  function updatePlanEst() {
    const el = $('nv-est'); if (!el || !S.prices) return;
    const P = S.prices.prices, m = S.prices.models, a = P.tahmin_varsayimlari || {};
    const model = m.claude;
    const len = $('nv-script').value.length + 1500;
    const target = Number($('nv-dur').value) || Math.max(30, Math.round(len / 12));
    const inTok = (a.plan_girdi_token_sabit || 1500) + 1200 + len * (a.plan_girdi_token_per_karakter || 0.35);
    const outTok = (a.plan_cikti_token_sabit || 800) + Math.max(4, Math.round(target / 7)) * 650;
    const pr = (P.claude && (P.claude[model] || P.claude._varsayilan)) || { girdi: 0, cikti: 0 };
    el.textContent = 'Plan ≈ ' + fmtUsd((inTok / 1e6) * pr.girdi + (outTok / 1e6) * pr.cikti) + ' · ' + model;
  }

    app.innerHTML = `<div class="page-head" id="v-head"></div><div class="steps" id="v-steps"></div><div id="v-body"></div>`;

  function videoStatusText(v) {
    const anyBusy = v.shots.some((s) => s.busy) || v.producing || v.assembling;
    const missing = v.shots.filter((s) => !s.video).length;
    return v.planning ? 'Planlanıyor' : v.planError && !v.shots.length ? 'Plan hatası' : !v.shots.length ? 'Plan yok' : v.final ? 'Hazır' : anyBusy ? 'Üretiliyor' : v.shots.some((s) => s.tool === 'flow' && !s.raw && !s.video) ? 'Klip bekleniyor' : v.shots.some((s) => s.error) ? 'Hata var' : missing ? (v.shots.length - missing) + '/' + v.shots.length + ' çekim hazır' : 'Birleştirmeye hazır';
  }
  function updateVideo(force) {
    const v = S.video;
    const json = JSON.stringify(v);
    if (!force && json === S.lastJson) return;
    if (!force && isEditing()) return; // yazarken ezme; kutudan çıkınca güncellenir
    S.lastJson = json;
    const m = v.maliyet || { toplam_usd: 0 };
    const pct = v.budget > 0 ? Math.min(100, (m.toplam_usd / v.budget) * 100) : 0;
    const planDur = v.shots.reduce((n, s) => n + (s.duration || 0), 0);
    $('v-head').innerHTML = `
      <div style="min-width:280px">
        <div class="crumb"><a href="#/">Videolar</a> / ${statusChip(videoStatusText(v))}</div>

        <div class="row" style="margin-top:8px;gap:8px"><div class="progress" style="width:200px"><i class="${m.toplam_usd > v.budget ? 'over' : ''}" style="width:${pct}%"></i></div><span class="small"><b>${fmtUsd(m.toplam_usd)}</b> / ${fmtUsd(v.budget)}</span><span class="small faint" title="${esc(spent(m))}">ⓘ</span></div>
      </div>
      <div class="actions">
        ${v.final ? `<a class="btn gold" href="${vFile(v.final, v.finalAt, true)}" download="${esc((v.name || 'video').replace(/[^\w\-ğüşöçıİĞÜŞÖÇ ]+/g, '').trim())}.mp4">Final videoyu indir</a>` : ''}
        <button class="ghost danger" id="btn-del">Sil</button>
      </div>`;
    const steps = [['setup', '1', 'Hazırlık'], ['shots', '2', 'Çekimler'], ['final', '3', 'Final']];
    $('v-steps').innerHTML = steps.map(([k, n, l]) => `<button class="${S.step === k ? 'on' : ''}" data-step="${k}" ${k !== 'setup' && !v.shots.length ? 'disabled' : ''}><b>${n}</b>${l}</button>`).join('');
    if (S.step === 'setup') renderSetup(); else if (S.step === 'shots') renderShots(); else renderFinal();
  }

  // --- 2. Çekimler ---
  const thumbClass = () => { const a = (S.video.plan && S.video.plan.aspect) || S.video.aspect; return a === '9:16' ? 'thumb v' : a === '1:1' ? 'thumb sq' : 'thumb'; };
  function renderShots() {
    const v = S.video;
    const warns = (v.plan && v.plan.warnings) || [], qs = (v.plan && v.plan.questions) || [];
    let html = '';
    if (warns.length || qs.length) html += `<details class="warnbox"><summary>${warns.length} uyarı${qs.length ? ', ' + qs.length + ' soru' : ''} (Claude)</summary>${warns.length ? `<ul style="margin:6px 0 0;padding-left:18px">${warns.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}${qs.length ? `<ul style="margin:6px 0 0;padding-left:18px">${qs.map((q) => `<li>${esc(q)}</li>`).join('')}</ul>` : ''}</details>`;
    const est = v.tahmin && v.tahmin.tumunu, hasFlow = v.shots.some((s) => s.tool === 'flow'), anyBusy = v.shots.some((s) => s.busy) || v.producing;
    html += `<div class="bar"><div><b>Kalan üretim tahmini: ${estTotal(est)}</b><div class="small muted">Her çekimi tek tek "Üret" ile ya da hepsini birden üretebilirsiniz. Beğenmediğinizi notla yeniden üretin.</div></div>
      <div class="row">${hasFlow ? `<a class="btn xs" href="/api/videos/${v.id}/pack">Dış araç paketini indir</a><label class="btn xs">Klipleri toplu yükle<input type="file" accept="video/*,.mp4,.mov,.webm" id="bulk-clips" multiple hidden></label>` : ''}<button class="gold" id="btn-produce" ${anyBusy || missingReason(['gemini']) ? 'disabled' : ''}>Eksik çekimleri üret</button></div></div>`;
    const sections = (v.plan && v.plan.sections) || [];
    const bySection = new Map();
    for (const s of v.shots) { if (!bySection.has(s.section_id)) bySection.set(s.section_id, []); bySection.get(s.section_id).push(s); }
    const ids = [...new Set([...sections.map((s) => s.id), ...bySection.keys()])];
    for (const secId of ids) {
      const sec = sections.find((s) => s.id === secId) || { id: secId, name: 'Bölüm ' + secId };
      const shots = bySection.get(secId) || [];
      html += `<div class="section"><b>${esc(sec.name)}</b><span class="small muted">${shots.length ? fmtT(shots[0].start) + ' – ' + fmtT(shots[shots.length - 1].start + shots[shots.length - 1].duration) : ''}${sec.color_grade && sec.color_grade !== 'none' ? ' · renk: ' + esc(sec.color_note || sec.color_grade) : ''}${sec.music_note ? ' · müzik: ' + esc(sec.music_note) : ''}</span><button class="xs ghost" data-addshot="${secId}" data-after="${shots.length ? shots[shots.length - 1].id : 0}">+ çekim</button></div>`;
      for (const s of shots) html += shotCard(s);
    }
    $('v-body').innerHTML = html;
  }
  function shotCard(s) {
    const open = S.openAdv.has(s.id), busy = !!s.busy, tool = s.tool;
    const need = { avatar: ['gemini', 'elevenlabs', 'fal'], gemini: ['gemini'], flow: ['gemini'], seedance: ['gemini', 'fal'], text_card: [] }[tool] || [];
    const miss = missingReason(need);
    const lines = [];
    for (const [i, d] of (s.dialogue || []).entries()) lines.push(`<div class="line"><span class="who">${esc(d.speaker)}</span><input type="text" class="sm" data-sline="${s.id}:dialogue:${i}:line" value="${esc(d.line)}"><input type="text" class="sm" data-sline="${s.id}:dialogue:${i}:emotion" value="${esc(d.emotion || '')}" placeholder="duygu"></div>`);
    for (const [i, d] of (s.voiceover || []).entries()) lines.push(`<div class="line vo"><span class="who">Dış ses · ${esc(d.narrator)}</span><input type="text" class="sm" data-sline="${s.id}:voiceover:${i}:line" value="${esc(d.line)}"><input type="text" class="sm" data-sline="${s.id}:voiceover:${i}:style" value="${esc(d.style || '')}" placeholder="üslup"></div>`);
    for (const [i, d] of (s.onscreen_text || []).entries()) lines.push(`<div class="line txt"><span class="who">Yazı · ${esc(d.style)}</span><textarea class="sm" data-sline="${s.id}:onscreen_text:${i}:text" style="min-height:36px">${esc(d.text)}</textarea><span class="small faint">${esc(d.start)}s · ${esc(d.duration)}s</span></div>`);
    const media = s.video ? `<video controls playsinline preload="metadata" src="${vFile(s.video, s.videoAt)}#t=0.3"></video>` : s.raw ? `<video controls playsinline preload="metadata" src="${vFile(s.raw, s.rawAt)}#t=0.3"></video>` : s.image ? `<img src="${vFile(s.image, s.imageAt)}" alt="">` : '<span>henüz üretilmedi</span>';
    const stKey = Object.keys(s.tahmin || {}).filter((k) => !((k === 'image' && s.image) || (k === 'audio' && s.audio) || (k === 'voiceover' && s.voFiles && s.voFiles.length) || (k === 'video' && (s.video || s.raw)) || (k === 'fixvoice' && s.video)));
    const estMissing = stepEst(s, stKey), estAll = stepEst(s, Object.keys(s.tahmin || {}));
    const waitingClip = tool === 'flow' && !s.raw && !s.video;
    const draft = S.drafts[s.id] || '';
    const revs = s.revisions || [];
    return `<div class="shot ${busy ? 'busy' : ''}" data-shot="${s.id}">
      <div>
        <div class="${thumbClass()}">${media}</div>
        <div class="row small" style="margin-top:6px;gap:6px">${statusChip(s.status || 'Bekliyor')}${s.manual ? '<span class="chip">klip elle</span>' : ''}${s.imageManual ? '<span class="chip">kare elle</span>' : ''}</div>
        ${s.audio ? `<audio controls preload="none" src="${vFile(s.audio, s.audioAt)}" style="width:100%;height:28px;margin-top:6px"></audio>` : ''}
        ${(s.voFiles || []).map((vo) => `<audio controls preload="none" src="${vFile(vo.file, s.voAt)}" style="width:100%;height:28px;margin-top:6px" title="dış ses"></audio>`).join('')}
      </div>
      <div>
        <div class="head"><b>#${s.id}</b><span>${fmtT(s.start)}</span><span>süre <input type="number" class="sm" data-sf="${s.id}:duration" value="${esc(s.duration)}" step="0.5" min="1" style="width:64px"> sn</span>${toolSelect(`data-sf="${s.id}:tool"`, tool)}${s.camera ? `<span class="faint">${esc(s.camera)}</span>` : ''}</div>
        <input type="text" class="sm" data-sf="${s.id}:description" value="${esc(s.description)}" style="margin-top:8px">
        <div class="small muted" style="margin-top:4px">${esc(s.tool_reason)}${s.characters && s.characters.length ? ' · ' + esc(s.characters.join(', ')) : ''}${s.location ? ' · ' + esc(s.location) : ''}</div>
        <div class="lines">${lines.join('')}</div>
        ${s.error ? `<div class="err mt">${esc(s.error)}</div>` : ''}
        ${s.fixNote ? `<div class="small muted mt">${esc(s.fixNote)}</div>` : ''}
        ${waitingClip && s.image ? `<div class="row mt small"><span class="muted">Dış araç:</span><a class="btn xs" href="${vFile(s.image, s.imageAt, true)}" download="cekim-${nn(s.id)}.jpg">Görseli indir</a><button class="xs" data-copy="${s.id}">Promptu kopyala</button><a href="https://labs.google/fx/tools/flow" target="_blank" rel="noopener">Flow</a><a href="https://app.klingai.com" target="_blank" rel="noopener">Kling</a><a href="https://app.runwayml.com" target="_blank" rel="noopener">Runway</a><span class="faint">klibi cekim-${nn(s.id)}.mp4 adıyla kaydedip yükleyin</span></div>` : ''}
        <div class="row mt" style="gap:12px"><button class="xs ghost" data-adv="${s.id}">${open ? 'ayrıntıları gizle' : 'promptlar ve adımlar'}</button><button class="xs ghost danger" data-sdel="${s.id}">Çekimi sil</button></div>
      </div>
      <div class="side">
        <div class="btns">
          <span class="act"><button class="xs gold" data-act="${s.video ? 'all' : 'auto'}" data-sid="${s.id}" ${busy || miss ? 'disabled' : ''} title="${esc(miss)}">${s.video ? 'Yeniden üret' : waitingClip && s.image ? 'Görseli yenile' : 'Üret'}</button><span class="est">${esc(s.video ? estAll : estMissing)}</span></span>
          <label class="btn xs ${busy ? 'dis' : ''}">İlk kare yükle<input type="file" accept="image/*" data-imgup="${s.id}" hidden ${busy ? 'disabled' : ''}></label>
          <label class="btn xs ${busy ? 'dis' : ''}">Klip yükle<input type="file" accept="video/*,.mp4,.mov,.webm" data-upload="${s.id}" hidden ${busy ? 'disabled' : ''}></label>
        </div>
        <div class="note">
          <label class="f" style="margin-top:0">Düzeltme notu <span class="faint">(Türkçe, yönetmene söyler gibi)</span></label>
          <textarea class="sm" data-note="${s.id}" placeholder="örn. kadın solda otursun, adam ona dönük konuşsun, daha loş olsun" ${busy ? 'disabled' : ''}>${esc(draft)}</textarea>
          <div class="row" style="margin-top:6px"><button class="xs" data-revise="${s.id}" ${busy || keyMissing('anthropic') ? 'disabled' : ''}>Notla yeniden üret</button><span class="est">${esc(estAll)}</span></div>
          ${revs.length ? `<div class="small" style="margin-top:6px;opacity:.8">${revs.map((r) => `<div>• <b>${esc(r.note)}</b>${r.answer ? ` <span class="faint">→ ${esc(r.answer)}</span>` : ''}</div>`).join('')}</div>` : ''}
        </div>
        <div class="small faint">Bu çekim: ${fmtUsd(s.maliyet ? s.maliyet.toplam_usd : 0)}</div>
      </div>
      ${open ? `<div class="adv">
        <div class="full"><label class="f">Görsel promptu (ilk kare) · karakter ve mekân tarifleri üretimde otomatik eklenir</label><textarea class="sm" data-sf="${s.id}:image_prompt">${esc(s.image_prompt)}</textarea></div>
        ${tool !== 'avatar' && tool !== 'text_card' ? `<div class="full"><label class="f">Video promptu</label><textarea class="sm" data-sf="${s.id}:video_prompt">${esc(s.video_prompt)}</textarea></div>` : ''}
        ${s.video_prompt_soft && s.video_prompt_soft_for === s.video_prompt ? `<div class="full"><label class="f">Yumuşatılmış prompt (Gemini filtresi için, otomatik)</label><div class="sm" style="white-space:pre-wrap;opacity:.75">${esc(s.video_prompt_soft)}</div></div>` : ''}
        ${tool === 'avatar' ? `<div class="full"><label class="f">Hareket promptu (isteğe bağlı)</label><input type="text" class="sm" data-sf="${s.id}:motion_prompt" value="${esc(s.motion_prompt || '')}"></div>` : ''}
        <div><label class="f">Karakterler (virgülle, kütüphane adları)</label><input type="text" class="sm" data-sf="${s.id}:characters" value="${esc((s.characters || []).join(', '))}"></div>
        <div><label class="f">Mekân</label><input type="text" class="sm" data-sf="${s.id}:location" value="${esc(s.location || '')}"></div>
        <div class="full row" style="align-items:flex-start">
          ${tool !== 'text_card' ? actBtn(s, s.image ? 'Görseli yeniden üret' : 'Görseli üret', 'image', busy || !!missingReason(['gemini']), stepEst(s, ['image'])) : ''}
          ${tool === 'avatar' ? actBtn(s, s.audio ? 'Sesi yeniden üret' : 'Sesi üret', 'audio', busy || !!missingReason(['elevenlabs']), stepEst(s, ['audio'])) : ''}
          ${(s.voiceover || []).length ? actBtn(s, s.voFiles && s.voFiles.length ? 'Dış sesi yeniden üret' : 'Dış sesi üret', 'voiceover', busy || !!missingReason(['elevenlabs']), stepEst(s, ['voiceover'])) : ''}
          ${tool !== 'flow' ? actBtn(s, s.video || s.raw ? 'Videoyu yeniden üret' : 'Videoyu üret', 'video', busy || !!missingReason(tool === 'avatar' || tool === 'seedance' ? ['fal'] : tool === 'gemini' ? ['gemini'] : []), stepEst(s, tool === 'gemini' ? ['video', 'fixvoice'] : ['video'])) : ''}
          ${(tool === 'gemini' || tool === 'flow') && s.raw ? actBtn(s, 'Sesi yeniden işle', 'fixvoice', busy, stepEst(s, ['fixvoice'])) : ''}
        </div>
        ${tool === 'gemini' || tool === 'flow' ? `<div class="full"><label class="check"><input type="checkbox" data-sf="${s.id}:fixVoice" ${s.fixVoice !== false ? 'checked' : ''}> Klibin sesini karakterin sabit sesine çevir (tek konuşan varsa, ses seçiliyse)</label></div>` : ''}
        <div class="full small muted">Tahmin kalemleri: ${Object.values(s.tahmin || {}).map(estLabel).join(' · ')}</div>
      </div>` : ''}
    </div>`;
  }
  const actBtn = (s, label, act, disabled, est) => `<span class="act"><button class="xs" data-act="${act}" data-sid="${s.id}" ${disabled ? 'disabled' : ''}>${label}</button><span class="est">${esc(est || '')}</span></span>`;
  function stepEst(s, keys) { const items = keys.map((k) => (s.tahmin || {})[k]).filter(Boolean); if (!items.length) return ''; if (items.length === 1) return estLabel(items[0]); const sum = { usd: 0, kredi: 0 }; for (const i of items) { sum.usd += i.usd || 0; sum.kredi += i.kredi || 0; } return estTotal(sum); }

  // --- 3. Final ---
  function renderFinal() {
    const v = S.video, layers = v.audio || [];
    const allHave = v.shots.length && v.shots.every((s) => s.video);
    const audioRows = layers.map((a, i) => `<div class="audio-row" data-ai="${i}">
      <select class="sm" data-af="type"><option value="music" ${a.type === 'music' ? 'selected' : ''}>müzik</option><option value="sfx" ${a.type === 'sfx' ? 'selected' : ''}>efekt</option><option value="silence" ${a.type === 'silence' ? 'selected' : ''}>sessizlik</option></select>
      <div class="row" style="gap:4px;flex-wrap:nowrap"><input type="number" class="sm" data-af="start" value="${esc(a.start)}" step="0.5" min="0" style="width:62px"><span class="faint">–</span><input type="number" class="sm" data-af="end" value="${esc(a.end)}" step="0.5" min="0" style="width:62px"></div>
      <div><input type="text" class="sm" data-af="description" value="${esc(a.description)}" placeholder="açıklama / üretim promptu" ${a.type === 'silence' ? 'disabled' : ''}><div class="small muted" style="margin-top:3px">${a.type === 'silence' ? 'müzik kapalı' : a.file ? (a.file.startsWith('lib:') ? 'kütüphaneden hazır' : 'üretildi') : esc(a.status || 'henüz üretilmedi')}${a.error ? ` <span class="err">${esc(a.error)}</span>` : ''}</div></div>
      <select class="sm" data-af="source" ${a.type === 'silence' ? 'disabled' : ''}>${(() => { const src = String(a.source || ''); const isLib = src.startsWith('library:'); const tag = src.slice(8).trim().toLowerCase(); const files = S.lib.audio || []; let matched = isLib ? files.find((f) => (f.tags || '').toLowerCase().includes(tag) || f.name.toLowerCase().includes(tag)) : null; if (isLib && !matched) matched = files.find((f) => tag.split(/[\s,]+/).some((w) => w.length > 2 && ((f.tags || '').toLowerCase().includes(w) || f.name.toLowerCase().includes(w)))); return `<option value="generate" ${!matched ? 'selected' : ''}>üret (ElevenLabs)</option>` + files.map((f) => `<option value="${esc('library:' + f.name)}" ${matched && matched.id === f.id ? 'selected' : ''}>kütüphane: ${esc(f.name)}</option>`).join(''); })()}</select>
      <button class="xs ghost danger" data-adel="${i}">✕</button></div>`).join('') || '<div class="small faint">Ses katmanı yok.</div>';
    $('v-body').innerHTML = `
      <div class="panel" style="margin-bottom:16px">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">Ses katmanları <span class="small muted">müzik / efekt / sessizlik · konuşma olan yerde müzik otomatik kısılır</span></h3>
          <span class="row"><button class="xs ghost" id="btn-addaudio">+ katman</button><span class="act"><button class="xs" id="btn-genaudio" ${v.producing ? 'disabled' : ''}>Eksik müzik/efektleri üret</button><span class="est">${estTotal(v.tahmin && v.tahmin.katmanlar)}</span></span></span></div>
        <div class="mt">${audioRows}</div>
        <div class="small faint mt">Kendi mp3'lerinizi Hazırlık → Müzik / efekt dosyaları'na yükleyip buradan "kütüphane" olarak seçebilirsiniz; ElevenLabs'ten üretmek kredi harcar.</div>
      </div>
      <div class="panel">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">Final video</h3><span class="row"><span class="small muted">${v.assembling ? '<span class="spin"></span> ' : ''}${esc(v.finalStatus || (allHave ? 'Tüm çekimler hazır.' : v.shots.filter((s) => !s.video).length + ' çekim henüz hazır değil.'))}${v.final && v.finalDuration ? ' · ' + fmtDur(v.finalDuration) : ''}</span><button class="xs gold" id="btn-assemble" ${!allHave || v.assembling || v.producing ? 'disabled' : ''}>${v.final ? 'Finali yenile' : 'Birleştir'}</button></span></div>
        ${v.finalError ? `<div class="err mt">${esc(v.finalError)}</div>` : ''}
        ${v.final ? `<div class="row mt"><video controls playsinline src="${vFile(v.final, v.finalAt)}" style="max-height:420px;max-width:100%;border-radius:8px;background:#000"></video></div><div class="row mt"><a class="btn gold" href="${vFile(v.final, v.finalAt, true)}" download="${esc((v.name || 'video').replace(/[^\w\-ğüşöçıİĞÜŞÖÇ ]+/g, '').trim())}.mp4">Final videoyu indir</a></div>` : ''}
      </div>`;
  }

  // ---------- olaylar ----------
  async function patchShot(sid, json) { S.video = await api(`/api/videos/${S.video.id}/shots/${sid}`, { method: 'PATCH', json }); S.lastJson = ''; }
  async function saveAudioLayers() {
    const rows = [...document.querySelectorAll('.audio-row')].map((r) => ({ type: r.querySelector('[data-af=type]').value, start: Number(r.querySelector('[data-af=start]').value), end: Number(r.querySelector('[data-af=end]').value), description: r.querySelector('[data-af=description]').value, source: r.querySelector('[data-af=source]').value }));
    S.video = await api(`/api/videos/${S.video.id}/audio`, { method: 'PATCH', json: { audio: rows } }); S.lastJson = '';
  }
  const refresh = () => updateVideo(true);
  app.addEventListener('click', async (ev) => {
    const t = ev.target;
    const padd = t.closest('[data-padd]'); if (padd) { const inp = padd.parentElement.querySelector('input[data-pfile]'); if (inp) inp.click(); return; }
    const open = t.closest('[data-open]'); if (open && !t.closest('button')) { location.hash = open.dataset.open; return; }
    const pdel = t.closest('img[data-pdel]');
    if (pdel) { const [kind, id, name] = pdel.dataset.pdel.split(':'); if (!confirm('Fotoğraf kaldırılsın mı?')) return; try { const it = await api(`/api/library/${kind}/${id}/photo/${name}`, { method: 'DELETE' }); S.lib[kind] = S.lib[kind].map((x) => (x.id === it.id ? it : x)); if (S.view === 'video') refresh(); else renderLib(); } catch (e) { toast(e.message); } return; }
    const btn = t.closest('button'); if (!btn) return;
    try {
      if (btn.id === 'nv-start') {
        const script = $('nv-script').value.trim(); if (!script) return toast('Senaryoyu yapıştırın.');
        btn.disabled = true;
        const v = await api('/api/videos', { method: 'POST', json: { name: $('nv-name').value.trim(), script, targetSeconds: Number($('nv-dur').value) || 0, budget: Number($('nv-budget').value), movingProvider: S.settings.movingProvider, assets: { auto: true } } });
        location.hash = '#/v/' + v.id;
      } else if (btn.dataset.delVideo) { if (!confirm('Video ve dosyaları silinsin mi?')) return; await api('/api/videos/' + btn.dataset.delVideo, { method: 'DELETE' }); toast('Silindi'); viewHome(); }
      else if (btn.id === 'st-save') { S.settings = await api('/api/settings', { method: 'PATCH', json: { aspect: $('st-aspect').value, notes: $('st-notes').value, defaultBudget: Number($('st-budget').value), look: $('st-look').value, lookCustom: $('st-look-custom').value } }); toast('Ayarlar kaydedildi'); }
      else if (btn.dataset.ladd) { const kind = btn.dataset.ladd; const name = $('new-' + kind).value.trim(); if (!name) return toast('Ad yazın.'); const it = await api('/api/library/' + kind, { method: 'POST', json: { name } }); S.lib[kind].push(it); if (S.view === 'video') refresh(); else renderLib(); toast('Eklendi'); }
      else if (btn.dataset.lsave) {
        const [kind, id] = btn.dataset.lsave.split(':'); const card = btn.closest('[data-lib]'); const body = {};
        for (const el of card.querySelectorAll('[data-lf]')) body[el.dataset.lf] = el.value;
        const it = await api(`/api/library/${kind}/${id}`, { method: 'PATCH', json: body }); S.lib[kind] = S.lib[kind].map((x) => (x.id === it.id ? it : x)); toast('Kaydedildi');
      } else if (btn.dataset.ldel) { const [kind, id] = btn.dataset.ldel.split(':'); if (!confirm('Silinsin mi?')) return; await api(`/api/library/${kind}/${id}`, { method: 'DELETE' }); S.lib[kind] = S.lib[kind].filter((x) => x.id !== id); if (S.view === 'video') refresh(); else renderLib(); }
      else if (btn.dataset.step) { S.step = btn.dataset.step; refresh(); }
      else if (btn.id === 'btn-plan') {
        if (S.video.shots.length && !confirm('Yeniden planlama mevcut çekim listesini ve üretilenlerin bağlantısını siler. Devam?')) return;
        btn.disabled = true;
        await api(`/api/videos/${S.video.id}`, { method: 'PATCH', json: { name: $('sc-name').value, script: $('sc-script').value, targetSeconds: Number($('sc-dur').value) || 0, hardPlanning: $('sc-hard').checked } });
        await apiConfirm(`/api/videos/${S.video.id}/plan`, { script: $('sc-script').value, targetSeconds: Number($('sc-dur').value) || 0, hardPlanning: $('sc-hard').checked });
        S.video = await api('/api/videos/' + S.video.id); refresh(); toast('Planlanıyor');
      }
      else if (btn.id === 'btn-produce') { await apiConfirm(`/api/videos/${S.video.id}/produce`); toast('Üretim başladı'); }
      else if (btn.id === 'btn-genaudio') { await apiConfirm(`/api/videos/${S.video.id}/audio/generate`); toast('Ses katmanları üretiliyor'); }
      else if (btn.id === 'btn-assemble') { await api(`/api/videos/${S.video.id}/assemble`, { method: 'POST', json: {} }); toast('Birleştirme başladı'); }
      else if (btn.id === 'btn-del') { if (!confirm('Video ve dosyaları silinsin mi?')) return; await api('/api/videos/' + S.video.id, { method: 'DELETE' }); location.hash = '#/'; }
      else if (btn.dataset.revise) {
        const sid = Number(btn.dataset.revise); const ta = document.querySelector(`textarea[data-note="${sid}"]`); const note = (ta && ta.value || '').trim();
        if (!note) { toast('Önce notu yazın.'); return; }
        btn.disabled = true; btn.textContent = 'Claude yeniden yazıyor…';
        const r = await api(`/api/videos/${S.video.id}/shots/${sid}/revise`, { method: 'POST', json: { note } });
        delete S.drafts[sid]; S.video = r.video; refresh(); toast(r.answer || 'Çekim yeniden yazıldı');
        await apiConfirm(`/api/videos/${S.video.id}/shots/${sid}/generate`, { step: 'auto' });
      }
      else if (btn.dataset.adv) { const id = Number(btn.dataset.adv); if (S.openAdv.has(id)) S.openAdv.delete(id); else S.openAdv.add(id); refresh(); }
      else if (btn.dataset.sdel) { if (!confirm('Çekim silinsin mi?')) return; S.video = await api(`/api/videos/${S.video.id}/shots/${btn.dataset.sdel}`, { method: 'DELETE' }); refresh(); }
      else if (btn.dataset.addshot) { S.video = await api(`/api/videos/${S.video.id}/shots`, { method: 'POST', json: { section_id: Number(btn.dataset.addshot), after: Number(btn.dataset.after) } }); refresh(); }
      else if (btn.id === 'btn-addaudio') { const list = (S.video.audio || []).map((a) => ({ type: a.type, start: a.start, end: a.end, description: a.description, source: a.source })); const last = S.video.shots[S.video.shots.length - 1]; list.push({ type: 'music', start: 0, end: last ? last.start + last.duration : 30, description: 'Yeni müzik', source: 'generate' }); S.video = await api(`/api/videos/${S.video.id}/audio`, { method: 'PATCH', json: { audio: list } }); refresh(); }
      else if (btn.dataset.adel != null) { const list = (S.video.audio || []).filter((_, i) => i !== Number(btn.dataset.adel)).map((a) => ({ type: a.type, start: a.start, end: a.end, description: a.description, source: a.source })); S.video = await api(`/api/videos/${S.video.id}/audio`, { method: 'PATCH', json: { audio: list } }); refresh(); }
      else if (btn.dataset.copy) { const s = S.video.shots.find((x) => x.id === Number(btn.dataset.copy)); const lk = S.video.lookEffective ? ' ' + S.video.lookEffective.video : ''; try { await navigator.clipboard.writeText((s.video_prompt || '') + lk); toast('Prompt kopyalandı (görünüm ekiyle)'); } catch { toast('Kopyalanamadı'); } }
      else if (btn.dataset.act) { btn.disabled = true; await apiConfirm(`/api/videos/${S.video.id}/shots/${btn.dataset.sid}/generate`, { step: btn.dataset.act }); toast('Başladı'); S.video = await api('/api/videos/' + S.video.id); refresh(); }
    } catch (e) { toast(e.message); if (btn.dataset.act || btn.id === 'nv-start' || btn.id === 'btn-plan' || btn.dataset.revise) { btn.disabled = false; if (btn.dataset.revise) btn.textContent = 'Notla yeniden üret'; } }
  });

  // alan kaydetme (focusout): çekim alanları, replik satırları, ses katmanları, video ayarları
  app.addEventListener('focusout', async (ev) => {
    const el = ev.target;
    if (!el.dataset || S.view !== 'video') return;
    try {
      if (el.dataset.sf) {
        const [sid, field] = el.dataset.sf.split(':');
        const s = S.video.shots.find((x) => x.id === Number(sid)); if (!s) return;
        let val = el.type === 'checkbox' ? el.checked : el.value;
        if (field === 'characters') val = val.split(',').map((x) => x.trim()).filter(Boolean);
        if (field === 'duration') val = Number(val);
        if (JSON.stringify(s[field]) === JSON.stringify(val)) return;
        await patchShot(Number(sid), { [field]: val });
        if (field === 'duration') refresh(); else toast('Kaydedildi');
      } else if (el.dataset.sline) {
        const [sid, list, idx, field] = el.dataset.sline.split(':');
        const s = S.video.shots.find((x) => x.id === Number(sid)); if (!s) return;
        const arr = JSON.parse(JSON.stringify(s[list] || [])); if (!arr[idx] || arr[idx][field] === el.value) return;
        arr[idx][field] = el.value; await patchShot(Number(sid), { [list]: arr }); toast('Kaydedildi');
      } else if (el.dataset.af) { await saveAudioLayers(); toast('Kaydedildi'); }
      else if (el.dataset.vs && el.tagName !== 'SELECT') { const f = el.dataset.vs; const val = f === 'budget' ? Number(el.value) : el.value; if (String(S.video[f] == null ? '' : S.video[f]) === String(val)) return; S.video = await api(`/api/videos/${S.video.id}`, { method: 'PATCH', json: { [f]: val } }); S.lastJson = ''; toast('Kaydedildi'); }
    } catch (e) { toast(e.message); }
  });
  app.addEventListener('change', async (ev) => {
    const el = ev.target;
    try {
      if (el.dataset && el.dataset.sf && (el.tagName === 'SELECT' || el.type === 'checkbox')) {
        const [sid, field] = el.dataset.sf.split(':');
        await patchShot(Number(sid), { [field]: el.type === 'checkbox' ? el.checked : el.value });
        refresh(); toast(field === 'tool' ? 'Araç değiştirildi' : 'Kaydedildi');
      } else if (el.dataset && el.dataset.vs && el.tagName === 'SELECT') { S.video = await api(`/api/videos/${S.video.id}`, { method: 'PATCH', json: { [el.dataset.vs]: el.value } }); refresh(); toast('Kaydedildi'); }
      else if (el.dataset && el.dataset.af && (el.tagName === 'SELECT')) { await saveAudioLayers(); refresh(); }
      else if (el.dataset && el.dataset.upload) {
        const file = el.files && el.files[0]; if (!file) return; toast('Klip yükleniyor…');
        await api(`/api/videos/${S.video.id}/shots/${el.dataset.upload}/upload`, { method: 'POST', body: file, headers: { 'Content-Type': file.type || 'application/octet-stream' } }); toast('Klip yüklendi'); S.video = await api('/api/videos/' + S.video.id); refresh();
      } else if (el.dataset && el.dataset.imgup) {
        const file = el.files && el.files[0]; if (!file) return; toast('İlk kare yükleniyor…');
        const r = await api(`/api/videos/${S.video.id}/shots/${el.dataset.imgup}/image`, { method: 'POST', body: file, headers: { 'Content-Type': file.type || 'image/jpeg' } }); S.video = r.video; refresh(); toast('İlk kare yüklendi; "Üret" deyince bu kareden devam eder');
      } else if (el.id === 'bulk-clips') {
        const files = Array.from(el.files || []); if (!files.length) return;
        let ok = 0; const bad = [];
        for (const file of files) {
          const m = file.name.match(/(\d{1,3})/); const sid = m ? Number(m[1]) : NaN;
          const sh = S.video.shots.find((x) => x.id === sid);
          if (!sh) { bad.push(file.name); continue; }
          toast(`Yükleniyor: ${file.name} → çekim #${sid}`);
          try { await api(`/api/videos/${S.video.id}/shots/${sid}/upload`, { method: 'POST', body: file, headers: { 'Content-Type': file.type || 'application/octet-stream' } }); ok++; } catch (e) { bad.push(file.name + ' (' + e.message + ')'); }
        }
        toast(`${ok} klip yüklendi${bad.length ? ' · eşleşmeyen: ' + bad.join(', ') : ''}`); S.video = await api('/api/videos/' + S.video.id); refresh();
      } else if (el.dataset && el.dataset.pfile) {
        const file = el.files && el.files[0]; if (!file) return; const [kind, id] = el.dataset.pfile.split(':'); toast('Fotoğraf yükleniyor…');
        const it = await api(`/api/library/${kind}/${id}/photo`, { method: 'POST', body: file, headers: { 'Content-Type': file.type || 'image/jpeg' } }); S.lib[kind] = S.lib[kind].map((x) => (x.id === it.id ? it : x)); if (S.view === 'video') { S.video.library = S.lib; refresh(); } else renderLib(); toast('Fotoğraf eklendi');
      } else if (el.id === 'na-file') {
        const file = el.files && el.files[0]; if (!file) return; const name = $('na-name').value.trim() || file.name.replace(/\.[^.]+$/, ''); toast('Yükleniyor…');
        const it = await api(`/api/library/audio?name=${encodeURIComponent(name)}&tags=${encodeURIComponent($('na-tags').value.trim())}`, { method: 'POST', body: file, headers: { 'Content-Type': file.type || 'audio/mpeg' } }); S.lib.audio.push(it); if (S.view === 'video') { S.video.library = S.lib; refresh(); } else renderLib(); toast('Ses dosyası eklendi');
      } else if (['nv-dur'].includes(el.id)) updatePlanEst();
    } catch (e) { toast(e.message); }
  });
  app.addEventListener('input', (ev) => {
    const el = ev.target;
    if (['nv-script', 'nv-dur'].includes(el.id)) updatePlanEst();
    if (el.dataset && el.dataset.note) S.drafts[Number(el.dataset.note)] = el.value;
  });

  (async () => { await loadStatus(); route(); setInterval(loadStatus, 60000); })();
})();
</script>
</body>
