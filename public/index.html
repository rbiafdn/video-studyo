<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Stüdyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --bg2: #ffffff; --panel: #ffffff; --panel2: #f3f4f7; --panel3: #e9ebf0; --line: #e4e7ec; --line2: #d3d8e0;
    --ink: #161a23; --muted: #5d6576; --faint: #959cab;
    --gold: #6d5efc; --gold2: #5b4cf0; --gold-ink: #ffffff; --gold-soft: rgba(109,94,252,.09); --gold-line: rgba(109,94,252,.35);
    --ok: #12a061; --ok-soft: rgba(18,160,97,.1); --warn: #c27a06; --err: #e0413c; --err-soft: rgba(224,65,60,.08); --off: #c8cdd6;
    --blue: #2f6fe0; --purple: #7c4ddb; --teal: #0e8f86;
    --r: 14px; --r-sm: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); min-height: 100vh; }
  a { color: var(--gold); text-decoration: none; } a:hover { text-decoration: underline; }
  h1 { font-size: 24px; margin: 0; font-weight: 700; letter-spacing: -.02em; } h2 { font-size: 18px; margin: 0 0 12px; font-weight: 650; letter-spacing: -.01em; } h3 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  p { margin: 6px 0; } .muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* üst çubuk */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 0 28px; height: 60px; background: rgba(255,255,255,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.01em; font-size: 15px; white-space: nowrap; color: var(--ink); }
  .brand:hover { text-decoration: none; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--gold); display: grid; place-items: center; color: #fff; }
  .brand span { color: var(--gold); }
  .tabs { display: flex; gap: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
  .tabs a { padding: 6px 14px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 500; } .tabs a:hover { color: var(--ink); text-decoration: none; } .tabs a.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .top nav { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .top nav a { color: var(--muted); }
  .conn { position: relative; } .conn summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .conn summary::-webkit-details-marker { display: none; } .conn summary:hover { border-color: var(--line2); color: var(--ink); }
  .conn .pop { position: absolute; right: 0; top: calc(100% + 8px); width: 330px; background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 14px; box-shadow: 0 16px 40px -12px rgba(16,24,40,.25); z-index: 30; }
  .conn .svc { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; } .conn .svc:last-of-type { border-bottom: 0; }
  .conn .svc .m { color: var(--faint); font-size: 11.5px; }
  .status-row { display: block; } #balance-row { font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); line-height: 1.7; }
  .dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--off); margin-top: 6px; } .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .conn summary .dot { margin-top: 0; }
  main { padding: 28px 28px 80px; max-width: 1480px; margin: 0 auto; }

  /* sayfa başlığı */
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
  .panel > h3:first-child { display: flex; align-items: center; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .grid-setup { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
  .grid-lib { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 20px; align-items: start; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; position: relative; transition: border-color .15s, transform .15s, background .15s; }
  .card.link { cursor: pointer; } .card.link:hover { border-color: var(--line2); background: var(--panel2); }
  .card .title { font-weight: 600; font-size: 15px; margin-bottom: 6px; padding-right: 56px; } .card .sub { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card .del { position: absolute; top: 12px; right: 12px; opacity: 0; transition: opacity .15s; } .card:hover .del, .card .del:focus { opacity: 1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); vertical-align: middle; white-space: nowrap; font-weight: 500; }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.ok { color: var(--ok); border-color: rgba(18,160,97,.35); background: var(--ok-soft); } .chip.err { color: var(--err); border-color: rgba(224,65,60,.35); background: var(--err-soft); } .chip.gold { color: var(--gold); border-color: var(--gold-line); background: var(--gold-soft); }
  .chip.t-avatar { color: var(--blue); } .chip.t-gemini, .chip.t-flow { color: var(--warn); } .chip.t-seedance { color: var(--purple); } .chip.t-text_card { color: var(--teal); }

  /* formlar */
  label.f { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; } label.f:first-child { margin-top: 0; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 5px; }
  input[type=text], input[type=number], textarea, select { width: 100%; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:hover, textarea:hover, select:hover { border-color: var(--line2); }
  input:focus, textarea:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  textarea { min-height: 70px; resize: vertical; line-height: 1.55; } textarea.tall { min-height: 300px; } textarea.sm { min-height: 44px; padding: 7px 10px; font-size: 13px; }
  input.sm, select.sm { padding: 7px 10px; font-size: 12.5px; border-radius: 8px; } select.sm { padding-right: 28px; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  input:disabled, textarea:disabled, select:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .mt { margin-top: 16px; }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; } .check input { accent-color: var(--gold); width: 16px; height: 16px; }
  details.set { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-top: 16px; }
  details.set summary { cursor: pointer; padding: 14px 20px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.set summary::-webkit-details-marker { display: none; }
  details.set summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; } details.set[open] summary::after { transform: rotate(-135deg); } details.set .body { padding: 0 20px 20px; }

  /* butonlar */
  button, .btn { font: inherit; font-size: 13.5px; font-weight: 500; padding: 9px 15px; border-radius: var(--r-sm); border: 1px solid var(--line2); background: #fff; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
  button:hover, .btn:hover { border-color: #b9c0cc; background: var(--panel2); text-decoration: none; } button:active, .btn:active { transform: translateY(1px); }
  button.gold, .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 650; box-shadow: 0 1px 2px rgba(16,24,40,.08); } button.gold:hover, .btn.gold:hover { background: var(--gold2); border-color: var(--gold2); }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); } button.ghost:hover { background: var(--panel2); color: var(--ink); }
  button.danger { color: var(--err); } button.danger:hover { background: var(--err-soft); color: var(--err); }
  button.xs, .btn.xs { font-size: 12.5px; padding: 6px 11px; border-radius: 8px; } button.big, .btn.big { font-size: 15px; padding: 13px 22px; border-radius: 12px; }
  button:disabled, .btn.dis { opacity: .4; cursor: not-allowed; box-shadow: none; } button:disabled:active { transform: none; }
  .act { display: inline-flex; flex-direction: column; gap: 4px; } .est { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .err { color: var(--err); font-size: 13px; white-space: pre-wrap; }
  .warnbox { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: var(--r); padding: 12px 18px; margin-bottom: 14px; }
  .warnbox summary { cursor: pointer; color: var(--gold); font-weight: 600; } .warnbox li { margin: 3px 0; }
  .progress { height: 6px; background: var(--panel3); border-radius: 99px; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s; } .progress i.over { background: var(--err); } .progress i.okbar { background: var(--ok); }
  .pulse { animation: pulse 1.6s ease-out 2; } @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(109,94,252,.5); } 100% { box-shadow: 0 0 0 14px rgba(109,94,252,0); } }

  /* karşılama */
  .hero { margin-bottom: 26px; } .hero h1 { font-size: 30px; } .hero p { color: var(--muted); font-size: 15px; margin-top: 8px; max-width: 640px; }
  .how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
  .how > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .how b.n { flex: none; width: 28px; height: 28px; border-radius: 9px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; font-size: 13px; border: 1px solid var(--gold-line); }
  .how strong { display: block; font-size: 13.5px; } .how span { color: var(--muted); font-size: 12.5px; }

  /* adımlar (stepper) */
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .steps button { justify-content: flex-start; text-align: left; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); color: var(--muted); white-space: normal; }
  .steps button:hover:not(:disabled) { background: var(--panel2); }
  .steps button b { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--panel3); color: var(--ink); font-size: 13px; display: grid; place-items: center; }
  .steps button .st-t { display: block; color: var(--ink); font-weight: 600; font-size: 14px; } .steps button .st-s { display: block; font-size: 12px; color: var(--faint); font-weight: 400; }
  .steps button.done b { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(18,160,97,.4); }
  .steps button.on { border-color: var(--gold); background: #fff; box-shadow: 0 0 0 3px var(--gold-soft); } .steps button.on b { background: var(--gold); color: var(--gold-ink); border: 0; }

  /* sıradaki adım rehberi */
  .guide { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: var(--r); border: 1px solid var(--gold-line); background: var(--gold-soft); margin-bottom: 18px; }
  .guide .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; font-size: 18px; }
  .guide .tx { flex: 1; min-width: 0; } .guide .tx b { display: block; font-size: 15px; } .guide .tx span { color: var(--muted); font-size: 13px; }
  .guide.ok { border-color: rgba(18,160,97,.4); background: linear-gradient(90deg, rgba(18,160,97,.1), rgba(18,160,97,.02)); } .guide.ok .ic { background: var(--ok-soft); color: var(--ok); }
  .guide.err { border-color: rgba(224,65,60,.4); background: linear-gradient(90deg, rgba(224,65,60,.09), rgba(224,65,60,.02)); } .guide.err .ic { background: var(--err-soft); color: var(--err); }
  .guide.busy .ic { background: var(--panel2); }

  /* çekim kartı */
  .section { margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .section b { font-size: 16px; letter-spacing: -.01em; }
  .shot { display: grid; grid-template-columns: 190px minmax(0, 1fr) 270px; gap: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); transition: border-color .2s; }
  .shot.busy { border-color: var(--gold-line); } .shot.has-err { border-color: rgba(224,65,60,.4); }
  .shot .thumb { width: 100%; aspect-ratio: 16 / 9; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 12px; text-align: center; padding: 0; }
  .shot .thumb.v { aspect-ratio: 9 / 16; max-height: 320px; } .shot .thumb.sq { aspect-ratio: 1 / 1; } .shot .thumb img, .shot .thumb video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .shot .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); } .shot .head b { color: var(--ink); font-size: 16px; }
  .shot .num { background: var(--panel3); border-radius: 8px; padding: 2px 8px; }
  .shot .lines { margin-top: 10px; display: grid; gap: 6px; }
  .line { display: grid; grid-template-columns: 120px minmax(0, 1fr) 120px; gap: 8px; align-items: center; font-size: 13px; }
  .line .who { color: var(--muted); font-size: 12px; font-weight: 500; } .line.vo .who { color: var(--purple); } .line.txt .who { color: var(--teal); }
  .shot .side { display: flex; flex-direction: column; gap: 10px; }
  .shot .side .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .shot .note { border: 1px solid var(--line); background: var(--panel2); border-radius: var(--r-sm); padding: 10px; }
  .shot .note textarea { min-height: 50px; background: #fff; }
  .shot .adv { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .adv .full { grid-column: 1 / -1; }
  .audio-row { display: grid; grid-template-columns: 100px 140px minmax(0, 1fr) 190px 40px; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 8px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; margin-bottom: 12px; }
  .photos { display: flex; gap: 6px; flex-wrap: wrap; } .photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; } .photos img:hover { border-color: var(--err); opacity: .8; } .photos .add { width: 56px; height: 56px; border: 1px dashed var(--line2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; cursor: pointer; } .photos .add:hover { border-color: var(--gold); color: var(--gold); }
  .lib-item { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 14px; margin-bottom: 10px; } .lib-item.used { border-color: var(--gold-line); }
  .lib-item .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .lib-item .full { grid-column: 1 / -1; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line2); border-top-color: var(--gold); border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -2px; } @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 10px); background: #161a23; border: 1px solid #161a23; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 90vw; z-index: 50; box-shadow: 0 16px 40px -10px rgba(16,24,40,.35); } .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { color: var(--muted); padding: 36px 24px; text-align: center; border: 1px dashed var(--line2); border-radius: var(--r); background: transparent; }
  .empty .ic { font-size: 28px; margin-bottom: 8px; }
  .help { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line2); color: var(--muted); font-size: 10.5px; font-weight: 700; cursor: help; vertical-align: 1px; margin-left: 4px; }

  @media (max-width: 1100px) { .grid-2, .grid-setup { grid-template-columns: 1fr; } .shot { grid-template-columns: 160px minmax(0, 1fr); } .shot .side { grid-column: 1 / -1; } }
  @media (max-width: 760px) {
    .top { padding: 0 16px; gap: 10px; } .top nav { display: none; } .brand .txt { display: none; } .conn summary .lbl { display: none; } .conn .pop { width: min(330px, calc(100vw - 32px)); }
    main { padding: 20px 16px 60px; } .hero h1 { font-size: 24px; } .how { grid-template-columns: 1fr; } .steps button .st-s { display: none; } .steps button { padding: 9px 8px; gap: 7px; } .steps button b { width: 24px; height: 24px; font-size: 12px; } .steps button .st-t { font-size: 13px; }
    .shot { grid-template-columns: 1fr; } .line { grid-template-columns: 1fr; gap: 4px; } .shot .adv, .lib-item .g2 { grid-template-columns: 1fr; }
    .audio-row { grid-template-columns: 1fr 1fr; } .audio-row > div:nth-child(3), .audio-row select[data-af=source] { grid-column: 1 / -1; }
    .guide { flex-wrap: wrap; } .guide .go { width: 100%; }
  }

  .card.link:hover { box-shadow: 0 4px 14px -6px rgba(16,24,40,.15); }
  .card { box-shadow: var(--shadow); }
  .aspects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .asp { flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: var(--r); white-space: normal; text-align: left; }
  .asp b { font-size: 14px; } .asp > span { font-size: 12px; color: var(--muted); font-weight: 400; }
  .asp.on { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-soft); }
  .asp .shape { display: block; border: 2px solid var(--muted); border-radius: 4px; margin-bottom: 6px; } .asp.on .shape { border-color: var(--gold); background: rgba(109,94,252,.15); }
  .shape.s916 { width: 18px; height: 30px; } .shape.s169 { width: 40px; height: 23px; margin-top: 7px; } .shape.s11 { width: 28px; height: 28px; margin-top: 2px; }
  @media (max-width: 760px) { .aspects { grid-template-columns: 1fr 1fr 1fr; } .asp > span { display: none; } .asp { padding: 10px; } }
  .cloud-ui { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .modal { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: flex; align-items: center; justify-content: center; z-index: 60; } .modal[hidden] { display: none; }
  .modal .box { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 20px; width: min(420px, 92vw); box-shadow: 0 24px 60px -20px rgba(16,24,40,.4); }
  .modal input[type=password] { width: 100%; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; }
  .cloud-list .card { padding: 12px 14px; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg></span><span class="txt" style="color:var(--ink)">Video <span>Stüdyo</span></span></a>
  <div class="tabs"><a href="#/" id="tab-videos">Videolar</a><a href="#/lib" id="tab-lib">Kütüphane</a></div>
  <nav id="crumbs"></nav>
  <div id="cloud-ui" class="cloud-ui"></div>
  <details class="conn" id="conn"><summary id="conn-sum"><span class="dot"></span><span class="lbl">Bağlantılar</span></summary><div class="pop"><div class="status-row" id="status-row">Durum yükleniyor…</div><div id="balance-row"></div></div></details>
</header>
<main id="app"></main>
<div class="modal" id="cloud-modal" hidden><div class="box">
  <h3 style="margin:0 0 4px">Bulut hesabı</h3><div class="small muted" style="margin-bottom:10px">Videolarınızı ve kütüphanenizi size özel buluta kaydedip başka bilgisayardan geri alırsınız.</div>
  <label class="f">E-posta</label><input type="text" id="cl-email" autocomplete="username" placeholder="ornek@gmail.com">
  <label class="f">Şifre</label><input type="password" id="cl-pass" autocomplete="current-password" placeholder="en az 6 karakter">
  <div class="err small" id="cl-err" style="margin-top:8px"></div>
  <div class="row mt"><button class="gold" id="cl-login">Giriş yap</button><button id="cl-signup">Kayıt ol</button><button class="ghost" id="cl-close">Kapat</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const S = { status: null, prices: null, voices: null, voicesError: null, settings: null, lib: null, looks: [], videos: [], video: null, step: null, openAdv: new Set(), drafts: {}, timer: null, lastJson: '', view: '' };
  const SERVICE = { claude: 'Claude', gemini: 'Gemini', elevenlabs: 'ElevenLabs', fal: 'fal.ai', flow: 'Dış araç', ffmpeg: 'ffmpeg' };
  const TOOL_NAMES = { avatar: 'Avatar (fal.ai)', gemini: 'Gemini (otomatik)', flow: 'Dış araç (elle)', seedance: 'Seedance (fal.ai)', text_card: 'Yazı kartı (ffmpeg)' };
  const ASPECTS = { '9:16': '9:16 dikey (Shorts, Reels)', '16:9': '16:9 yatay (YouTube, TV)', '1:1': '1:1 kare' };

  // ---------- yardımcılar ----------
  async function api(path, opts) {
    const o = Object.assign({ headers: {} }, opts || {});
    if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers['Content-Type'] = 'application/json'; delete o.json; }
    const ses = cloudSession(); if (ses) o.headers['x-sb-session'] = btoa(unescape(encodeURIComponent(JSON.stringify(ses))));
    const res = await fetch(path, o);
    let data = null; try { data = await res.json(); } catch { data = null; }
    if (data && data.session && data.session.access_token) saveCloudSession(data.session);
    if (!res.ok) { const e = new Error((data && (data.error || data.message)) || ('İstek başarısız (' + res.status + ')')); e.status = res.status; e.data = data; throw e; }
    return data;
  }
  async function apiConfirm(path, json) {
    try { return await api(path, { method: 'POST', json: json || {} }); }
    catch (e) {
      if (e.status === 409 && e.data && e.data.needsConfirm) { if (!window.confirm(e.data.message)) throw new Error('İşlem iptal edildi.'); return api(path, { method: 'POST', json: Object.assign({}, json || {}, { confirmed: true }) }); }
      throw e;
    }
  }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800); }
  const fmtUsd = (n) => { n = Number(n) || 0; return n === 0 ? '$0.00' : n < 0.01 ? '$' + n.toFixed(3) : '$' + n.toFixed(2); };
  const fmtNum = (n) => (Number(n) || 0).toLocaleString('tr-TR');
  const fmtDate = (s) => new Date(s).toLocaleString('tr-TR', { dateStyle: 'short', timeStyle: 'short' });
  const fmtDur = (sec) => { sec = Math.round(sec || 0); return sec >= 60 ? Math.floor(sec / 60) + ' dk ' + (sec % 60) + ' sn' : sec + ' sn'; };
  const fmtT = (sec) => { sec = Math.max(0, Number(sec) || 0); const m = Math.floor(sec / 60), s = sec - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
  const keyMissing = (k) => !(S.status && S.status.keys && S.status.keys[k]);
  function missingReason(list) { const names = { anthropic: 'ANTHROPIC_API_KEY', gemini: 'GEMINI_API_KEY', elevenlabs: 'ELEVENLABS_API_KEY', fal: 'FAL_KEY' }; const miss = list.filter(keyMissing).map((k) => names[k]); return miss.length ? 'Eksik anahtar: ' + miss.join(', ') : ''; }
  function isEditing() { const el = document.activeElement; return el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.tagName === 'SELECT'); }
  const vFile = (name, stamp, dl) => `/files/v/${S.video.id}/${name}?v=${stamp || 0}${dl ? '&download=1' : ''}`;
  const nn = (id) => String(id).padStart(2, '0');
  function estLabel(item) {
    if (!item) return '';
    if (item.servis === 'flow') return 'dış araçta üretilir';
    if (item.servis === 'ffmpeg') return 'ücretsiz';
    if (item.servis === 'elevenlabs') return item.karakter != null ? '≈ ' + fmtNum(item.karakter) + ' karakter · ElevenLabs' : '≈ ' + fmtNum(item.kredi) + ' kredi · ElevenLabs';
    return '≈ ' + fmtUsd(item.usd) + ' · ' + (SERVICE[item.servis] || item.servis);
  }
  function estTotal(t) { if (!t) return ''; const parts = []; if (t.usd > 0) parts.push('≈ ' + fmtUsd(t.usd)); if (t.kredi > 0) parts.push(fmtNum(t.kredi) + ' kredi'); return parts.length ? parts.join(' + ') : '≈ $0.00'; }
  function spent(m) {
    if (!m) return fmtUsd(0);
    const parts = [];
    for (const k of ['claude', 'gemini', 'fal']) { const s = m.servisler[k]; if (s && s.usd > 0) parts.push(SERVICE[k] + ' ' + fmtUsd(s.usd)); }
    const el = m.servisler.elevenlabs; if (el && el.kredi > 0) parts.push('ElevenLabs ' + fmtNum(el.kredi) + ' kredi' + (el.usd > 0 ? ' (≈ ' + fmtUsd(el.usd) + ')' : ''));
    return fmtUsd(m.toplam_usd) + (parts.length ? ' (' + parts.join(' · ') + ')' : '');
  }
  function spentChips(m) {
    const sv = (m && m.servisler) || {};
    return ['claude', 'gemini', 'fal', 'elevenlabs'].map((k) => {
      const s = sv[k] || {};
      const val = k === 'elevenlabs'
        ? (s.kredi > 0 ? fmtNum(s.kredi) + ' kredi' + (s.usd > 0 ? ' (≈ ' + fmtUsd(s.usd) + ')' : '') : fmtUsd(0))
        : fmtUsd(s.usd || 0);
      return `<span class="chip">${SERVICE[k]} <b>${val}</b></span>`;
    }).join(' ');
  }
  function voiceSelect(attrs, value, cls) {
    if (!S.voices) return `<input type="text" class="${cls || ''}" ${attrs} value="${esc(value || '')}" placeholder="ElevenLabs ses ID">`;
    const opts = ['<option value="">— ses yok (klibin kendi sesi) —</option>'].concat(S.voices.map((v) => { const lab = [v.labels && v.labels.gender, v.labels && v.labels.accent].filter(Boolean).join(', '); const paid = v.category && v.category !== 'premade' ? ' · ücretli plan' : ''; return `<option value="${esc(v.voice_id)}" ${v.voice_id === value ? 'selected' : ''}>${esc(v.name)}${lab ? ' (' + esc(lab) + ')' : ''}${paid}</option>`; }));
    if (value && !S.voices.some((v) => v.voice_id === value)) opts.push(`<option value="${esc(value)}" selected>${esc(value)}</option>`);
    return `<select class="${cls || ''}" ${attrs}>${opts.join('')}</select>`;
  }
  function statusChip(st) { const cls = st === 'Hazır' ? 'ok' : /hata/i.test(st) ? 'err' : /bekleniyor|Onay/i.test(st) ? 'gold' : ''; return `<span class="chip ${cls}">${/Planlanıyor|Üretiliyor|üretiliyor|başlatılıyor|çevriliyor|ayrılıyor|yumuşatılıyor|indiriliyor|klibe ekleniyor/.test(st) ? '<span class="spin"></span> ' : ''}${esc(st)}</span>`; }
  const toolChip = (t) => `<span class="chip t-${esc(t)}">${esc(TOOL_NAMES[t] || t)}</span>`;
  const toolSelect = (attrs, value) => `<select class="sm" ${attrs} style="width:auto">${Object.entries(TOOL_NAMES).map(([k, v]) => `<option value="${k}" ${k === value ? 'selected' : ''}>${v}</option>`).join('')}</select>`;

  // ---------- üst çubuk ----------
  async function loadStatus() {
    try { S.status = await api('/api/status'); } catch { $('status-row').textContent = 'Sunucuya ulaşılamıyor'; return; }
    const k = S.status.keys, m = S.status.models;
    const svcs = [[k.anthropic, 'Claude', 'Senaryoyu çekimlere böler', m.claude], [k.gemini, 'Gemini', 'Görsel ve video üretir', m.image + ' · ' + m.video], [k.elevenlabs, 'ElevenLabs', 'Seslendirme, müzik, efekt', m.dialogue], [k.fal, 'fal.ai', 'Konuşan avatar, Seedance', m.avatar], [S.status.ffmpeg, 'ffmpeg', 'Videoyu birleştirir (ücretsiz)', '']];
    $('status-row').innerHTML = svcs.map(([ok, label, what, model]) => `<div class="svc"><span class="dot ${ok ? 'on' : ''}"></span><div><b>${label}</b> <span class="muted">· ${what}</span>${ok ? (model ? `<div class="m">${esc(model)}</div>` : '') : '<div class="m" style="color:var(--err)">Anahtar eksik (.env)</div>'}</div></div>`).join('');
    const on = svcs.filter((x) => x[0]).length;
    $('conn-sum').innerHTML = `<span class="dot ${on === svcs.length ? 'on' : ''}" style="${on < svcs.length ? 'background:var(--warn)' : ''}"></span><span class="lbl">${on === svcs.length ? 'Tüm servisler bağlı' : on + '/' + svcs.length + ' servis bağlı'}</span>`;
    loadBalances();
    if (!S.prices) { try { S.prices = await api('/api/prices'); } catch { /* sessiz */ } }
  }
  async function loadBalances() {
    try {
      const b = await api('/api/balances'); const parts = [];
      if (b.elevenlabs) parts.push(`ElevenLabs kalan: <b>${fmtNum(b.elevenlabs.remaining)}</b> / ${fmtNum(b.elevenlabs.limit)} kredi`);
      const L = b.links || {};
      parts.push(`Bakiye: <a href="${esc(L.anthropic)}" target="_blank" rel="noopener">Anthropic</a> · <a href="${esc(L.gemini)}" target="_blank" rel="noopener">Google</a> · <a href="${esc(L.fal)}" target="_blank" rel="noopener">fal.ai</a>${b.elevenlabs ? '' : ' · <a href="' + esc(L.elevenlabs) + '" target="_blank" rel="noopener">ElevenLabs</a>'}`);
      $('balance-row').innerHTML = parts.join('<br>');
    } catch { /* sessiz */ }
  }
  async function loadVoices() { if (S.voices) return; if (keyMissing('elevenlabs')) { S.voicesError = 'ELEVENLABS_API_KEY tanımlı değil.'; return; } try { S.voices = await api('/api/voices'); S.voicesError = null; } catch (e) { S.voicesError = e.message; } }
  async function loadBase() { [S.settings, S.lib, S.looks] = await Promise.all([api('/api/settings'), api('/api/library'), api('/api/looks').catch(() => [])]); await loadVoices(); }
  function crumbs(items) { $('crumbs').innerHTML = items.map((c, i) => (c.href && i < items.length - 1) ? `<a href="${c.href}">${esc(c.label)}</a>` : `<span>${esc(c.label)}</span>`).join(' <span class="faint">/</span> '); }

  // ---------- yönlendirme ----------
  function stopPoll() { if (S.timer) clearInterval(S.timer); S.timer = null; }
  function route() {
    stopPoll();
    const h = location.hash.replace(/^#/, '') || '/';
    $('tab-videos').classList.toggle('on', !h.startsWith('/lib'));
    $('tab-lib').classList.toggle('on', h.startsWith('/lib'));
    const m = h.match(/^\/v\/([\w-]+)(?:\/(setup|shots|final))?$/);
    if (m) return viewVideo(m[1], m[2]);
    if (h.startsWith('/lib')) return viewLibrary();
    return viewHome();
  }
  window.addEventListener('hashchange', route);

  // ---------- ANA SAYFA ----------
  async function viewHome() {
    S.view = 'home'; crumbs([]);
    try { await loadBase(); S.videos = await api('/api/videos'); } catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    const st = S.settings, r = missingReason(['anthropic']);
    app.innerHTML = `
      <div class="grid-2">
        <section class="panel">
          <h2>Yeni video</h2>
          <label class="f">1. Senaryoyu yapıştır</label><textarea class="tall" id="nv-script" placeholder="Senaryoyu olduğu gibi buraya yapıştır."></textarea>
          <label class="f">2. Video nerede yayınlanacak?</label>
          <div class="aspects" id="nv-aspect">
            ${[['9:16', 'Dikey', 'Reels, Shorts, TikTok'], ['16:9', 'Yatay', 'YouTube, TV'], ['1:1', 'Kare', 'Instagram gönderi']].map(([k, t, d]) => `<button type="button" class="asp ${k === (st.aspect === 'auto' ? '9:16' : st.aspect) ? 'on' : ''}" data-aspect="${k}"><i class="shape s${k.replace(':', '')}"></i><b>${t} <span class="faint">${k}</span></b><span>${d}</span></button>`).join('')}
          </div>
          <details class="set" style="margin-top:14px"><summary class="small">Diğer ayarlar (isteğe bağlı)</summary><div class="body"><div class="row" style="align-items:flex-start">
            <div style="flex:2;min-width:180px"><label class="f">Video adı</label><input type="text" id="nv-name" placeholder="Boşsa senaryodan konur"></div>
            <div style="flex:1;min-width:110px"><label class="f">Süre (sn)</label><input type="number" id="nv-dur" min="0" step="1" placeholder="Senaryodan"></div>
            <div style="flex:1;min-width:110px"><label class="f">Bütçe sınırı ($)</label><input type="number" id="nv-budget" value="${esc(st.defaultBudget)}" min="0" step="1"></div>
          </div></div></details>
          <div class="row mt"><span class="act"><button class="gold big" id="nv-start" ${r ? 'disabled' : ''}>3. Çekim listesini hazırla →</button><span class="est" id="nv-est"></span></span><span class="small err">${esc(r)}</span></div>
        </section>
        <section><h2>Videoların</h2><div class="cards" id="video-cards"></div><div id="cloud-videos"></div></section>
      </div>`;
    renderVideoCards(); updatePlanEst(); renderCloudVideos();
    S.timer = setInterval(async () => { if (S.view !== 'home') return; try { const nv = await api('/api/videos'); if (JSON.stringify(nv) !== JSON.stringify(S.videos)) { S.videos = nv; renderVideoCards(); } } catch { /* sessiz */ } }, 4000);
  }
  function renderVideoCards() {
    $('video-cards').innerHTML = S.videos.length ? S.videos.map((v) => `
      <div class="card link" data-open="#/v/${esc(v.id)}">
        <div class="title">${esc(v.name)}</div>
        <div class="sub">${statusChip(v.status)}<span>${v.shotCount ? v.shotCount + ' çekim · ' : ''}${v.targetSeconds ? fmtDur(v.targetSeconds) + ' · ' : ''}${esc(v.aspect)}</span></div>
        <div class="sub" style="margin-top:10px"><span>Harcanan <b style="color:var(--ink)">${fmtUsd(v.toplam_usd)}</b> / ${fmtUsd(v.budget)}</span><span class="faint">· ${fmtDate(v.createdAt)}</span></div>
        <button class="xs ghost danger del" data-del-video="${esc(v.id)}" title="Videoyu sil">Sil</button>
      </div>`).join('') : '<div class="empty"><div class="ic">🎬</div><b style="color:var(--ink)">Henüz video yok</b><div class="small" style="margin-top:4px">Soldaki kutuya senaryonu yapıştırıp ilk videonu başlat.</div></div>';
  }
  function updatePlanEst() {
    const el = $('nv-est'); if (!el || !S.prices) return;
    const P = S.prices.prices, m = S.prices.models, a = P.tahmin_varsayimlari || {};
    const model = m.claude;
    const len = $('nv-script').value.length + 1500;
    const target = Number($('nv-dur').value) || Math.max(30, Math.round(len / 12));
    const inTok = (a.plan_girdi_token_sabit || 1500) + 1200 + len * (a.plan_girdi_token_per_karakter || 0.35);
    const outTok = (a.plan_cikti_token_sabit || 800) + Math.max(4, Math.round(target / 7)) * 650;
    const pr = (P.claude && (P.claude[model] || P.claude._varsayilan)) || { girdi: 0, cikti: 0 };
    el.textContent = 'Plan ≈ ' + fmtUsd((inTok / 1e6) * pr.girdi + (outTok / 1e6) * pr.cikti) + ' · ' + model;
  }

  // ---------- KÜTÜPHANE (kartlar; Hazırlık adımında da kullanılır) ----------
  async function viewLibrary() {
    S.view = 'lib'; crumbs([]);
    try { await loadBase(); } catch (e) { app.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    const st = S.settings;
    app.innerHTML = `
      <div class="page-head"><div><h1>Kütüphane</h1><div class="meta">Tüm videolarda ortak varlıklar. Her videonun Hazırlık adımında da aynı kartlar görünür ve oradan düzenlenebilir.</div></div></div>
      ${S.voicesError ? `<div class="small err" style="margin-bottom:10px">${esc(S.voicesError)}</div>` : ''}
      <div class="grid-lib">
        <section class="panel"><h3>Karakterler</h3><div id="lib-characters"></div></section>
        <section class="panel"><h3>Mekânlar</h3><div id="lib-locations"></div></section>
        <section class="panel"><h3>Dış ses (anlatıcılar)</h3><div id="lib-narrators"></div></section>
        <section class="panel"><h3>Müzik / efekt dosyaları</h3><div id="lib-audio"></div></section>
      </div>
      <details class="set" open><summary>Yedek / başka bilgisayara taşıma</summary><div class="body">
        <div id="cloud-lib" style="margin-bottom:10px"></div>
        <div class="row"><a class="btn" href="/api/backup">Yedek indir (zip)</a><label class="btn">Yedek yükle (zip)<input type="file" accept=".zip,application/zip" id="restore-file" hidden></label><span class="small muted">Tüm videolar, kütüphane ve ayarlar tek zip olur. Evdeki bilgisayarda projeyi GitHub'dan kurup aynı anahtarlarla <code>.env</code> oluşturun, sonra zip'i buradan yükleyin. Yükleme mevcut kayıtların üstüne yazar.</span></div>
      </div></details>
      <details class="set"><summary>Yeni videolar için varsayılan ayarlar</summary><div class="body">
        <div class="lib-item"><div class="g2">
          <div><label class="f">Görüntü oranı</label><select id="st-aspect"><option value="auto" ${st.aspect === 'auto' ? 'selected' : ''}>Senaryodan (Shorts → dikey)</option>${Object.entries(ASPECTS).map(([k, v]) => `<option value="${k}" ${k === st.aspect ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <div><label class="f">Görünüm</label><select id="st-look">${(S.looks || []).map((l) => `<option value="${l.key}" ${l.key === (st.look || 'film') ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></div>
          <div><label class="f">Görünüme ek (İngilizce)</label><input type="text" id="st-look-custom" value="${esc(st.lookCustom || '')}" placeholder="1950s Anatolia, winter"></div>
          <div><label class="f">Varsayılan bütçe (USD)</label><input type="number" id="st-budget" value="${esc(st.defaultBudget)}" min="0" step="1"></div>
          <div class="full"><label class="f">Genel tarz notları (Claude her planda okur)</label><textarea id="st-notes">${esc(st.notes)}</textarea></div>
          <div class="full row"><button class="xs gold" id="st-save">Kaydet</button></div>
        </div></div>
      </div></details>`;
    renderLib(); renderCloudLib();
  }
  const photoStrip = (kind, it) => `<div class="photos">${(it.photos || []).map((p) => `<img src="/files/lib/${esc(p)}" title="Kaldırmak için tıklayın" data-pdel="${kind}:${esc(it.id)}:${esc(p)}">`).join('')}${(it.photos || []).length < 4 ? `<div class="add" data-padd="${kind}:${esc(it.id)}">+ foto</div><input type="file" accept="image/*" data-pfile="${kind}:${esc(it.id)}" hidden>` : ''}</div>`;
  function libCard(kind, it, used) {
    const cls = `lib-item ${used ? 'used' : ''}`, tag = used ? ' <span class="chip gold">bu videoda</span>' : '';
    if (kind === 'characters') return `<div class="${cls}" data-lib="characters:${esc(it.id)}"><div class="g2">
        <div><label class="f">Ad${tag}</label><input type="text" class="sm" data-lf="name" value="${esc(it.name)}"></div>
        <div><label class="f">Ses (ElevenLabs)</label>${voiceSelect('data-lf="voiceId"', it.voiceId, 'sm')}</div>
        <div class="full"><label class="f">Tarif (yaş, yüz, kıyafet; İngilizce önerilir). Üretimde fotoğraflarla birlikte kullanılır.</label><textarea class="sm" data-lf="description">${esc(it.description || '')}</textarea></div>
        <div><label class="f">Ses notu</label><input type="text" class="sm" data-lf="voiceNote" value="${esc(it.voiceNote || '')}" placeholder="örn. tok, kısık"></div>
        <div><label class="f">Referans fotoğraflar (1–4)</label>${photoStrip('characters', it)}</div>
        <div class="full row"><button class="xs gold" data-lsave="characters:${esc(it.id)}">Kaydet</button><button class="xs ghost danger" data-ldel="characters:${esc(it.id)}">Sil</button></div></div></div>`;
    if (kind === 'locations') return `<div class="${cls}" data-lib="locations:${esc(it.id)}"><div class="g2">
        <div><label class="f">Ad${tag}</label><input type="text" class="sm" data-lf="name" value="${esc(it.name)}"></div>
        <div><label class="f">Referans fotoğraflar (1–4)</label>${photoStrip('locations', it)}</div>
        <div class="full"><label class="f">Tarif</label><textarea class="sm" data-lf="description">${esc(it.description || '')}</textarea></div>
        <div class="full row"><button class="xs gold" data-lsave="locations:${esc(it.id)}">Kaydet</button><button class="xs ghost danger" data-ldel="locations:${esc(it.id)}">Sil</button></div></div></div>`;
    if (kind === 'narrators') return `<div class="${cls}" data-lib="narrators:${esc(it.id)}"><div class="g2">

  function renderLib(usedNames) {

  // ---------- VİDEO SAYFASI ----------
  async function viewVideo(id, step) {
    S.view = 'video';
    try { await loadBase(); S.video = await api('/api/videos/' + id); } catch (e) { location.hash = '#/'; toast(e.message); return; }
    if (S.video.library) S.lib = S.video.library;
    S.step = step || (S.video.shots.length ? 'shots' : 'setup'); S.openAdv = new Set();
    crumbs([{ label: 'Videolar', href: '#/' }, { label: S.video.name || 'Video' }]);
    S.lastJson = '';
    app.innerHTML = `<div class="page-head" id="v-head"></div><div class="steps" id="v-steps"></div><div id="v-guide"></div><div id="v-body"></div>`;
    updateVideo(true);
    S.timer = setInterval(async () => { if (S.view !== 'video') return; try { S.video = await api('/api/videos/' + id); if (S.video.library) S.lib = S.video.library; updateVideo(false); } catch { /* sessiz */ } }, 3000);
  }
  function videoStatusText(v) {
    const anyBusy = v.shots.some((s) => s.busy) || v.producing || v.assembling;
    const missing = v.shots.filter((s) => !s.video).length;
    return v.planning ? 'Planlanıyor' : v.planError && !v.shots.length ? 'Plan hatası' : !v.shots.length ? 'Plan yok' : v.final ? 'Hazır' : anyBusy ? 'Üretiliyor' : v.shots.some((s) => s.tool === 'flow' && !s.raw && !s.video) ? 'Klip bekleniyor' : v.shots.some((s) => s.error) ? 'Hata var' : missing ? (v.shots.length - missing) + '/' + v.shots.length + ' çekim hazır' : 'Birleştirmeye hazır';
  }
  // "Sıradaki adım" rehberi: kullanıcıya şu an ne yapması gerektiğini tek cümleyle söyler
  function guideHtml(v) {
    const shots = v.shots, ready = shots.filter((s) => s.video).length, busy = shots.some((s) => s.busy) || v.producing;
    const box = (kind, icon, title, text, btn) => `<div class="guide ${kind}"><div class="ic">${icon}</div><div class="tx"><b>${title}</b><span>${text}</span></div>${btn || ''}</div>`;
    const go = (step, target, label, primary) => `<button class="go ${primary ? 'gold' : ''}" data-goto="${step}:${target}">${label}</button>`;
    if (v.planning) return box('busy', '<span class="spin" style="width:18px;height:18px"></span>', 'Claude senaryonu okuyor…', '1–4 dakika sürer, sayfa kendini yeniler.');
    if (!shots.length && v.planError) return box('err', '!', 'Planlama tamamlanamadı', 'Hata mesajına bakıp tekrar dene.', S.step !== 'setup' ? go('setup', 'btn-plan', 'Hazırlığa git') : '');
    if (!shots.length) return box('', '1', 'Çekim listesini hazırla', '"Çekim listesini hazırla" düğmesine bas.', go('setup', 'btn-plan', 'Göster', true));
    if (v.assembling) return box('busy', '<span class="spin" style="width:18px;height:18px"></span>', 'Final video birleştiriliyor…', 'Birkaç dakika sürebilir.');
    if (v.final) return box('ok', '✓', 'Videon hazır!', 'Final sekmesinden izleyebilir ya da hemen indirebilirsin.', `<a class="btn gold go" href="${vFile(v.final, v.finalAt, true)}" download="${esc((v.name || 'video').replace(/[^\w\-ğüşöçıİĞÜŞÖÇ ]+/g, '').trim())}.mp4">İndir</a>`);
    if (busy) return box('busy', '<span class="spin" style="width:18px;height:18px"></span>', `Çekimler üretiliyor · ${ready}/${shots.length} hazır`, 'Bitenler sırayla görünür.', S.step !== 'shots' ? go('shots', '', 'Çekimlere git') : '');
    const errs = shots.filter((s) => s.error).length;
    if (errs) return box('err', '!', `${errs} çekimde hata var`, 'Kırmızı çerçeveli çekimde "Üret" ile tekrar dene.', go('shots', 'first-err', 'Hatalı çekime git'));
    if (shots.some((s) => s.tool === 'flow' && !s.raw && !s.video)) return box('', '↥', 'Bazı çekimler klip bekliyor', 'Klibi dış araçta üretip "Klip yükle" ile ekle.', go('shots', '', 'Çekimlere git'));
    if (ready < shots.length) return box('', '2', ready ? `${shots.length - ready} çekim kaldı` : 'Sıra çekimleri üretmekte', 'Çekimlere göz at, sonra "Eksik çekimleri üret" de.', go('shots', 'btn-produce', 'Üretime geç', true));
    return box('ok', '3', 'Tüm çekimler hazır!', 'Final sekmesinde "Birleştir" de.', go('final', 'btn-assemble', 'Finale geç', true));
  }

      <div style="min-width:280px">
        <div class="crumb"><a href="#/">← Videolar</a>${statusChip(videoStatusText(v))}</div>
        <h1>${esc(v.name || 'Video')}</h1>
        <div class="meta">${v.shots.length ? v.shots.length + ' çekim · ' + fmtDur(planDur) + ' · ' : ''}${esc((v.plan && v.plan.aspect) || v.aspect)} · ${esc(v.resolution || '720p')}${v.lookEffective ? ' · ' + esc(v.lookEffective.name) : ''}</div>
      </div>

        <div class="progress" style="margin-top:8px"><i class="${m.toplam_usd > v.budget ? 'over' : ''}" style="width:${pct}%"></i></div>
        <div class="row" style="margin-top:10px;gap:6px">${spentChips(m)}</div>
      </div>
      <div class="actions">
        ${v.final ? `<a class="btn gold" href="${vFile(v.final, v.finalAt, true)}" download="${esc((v.name || 'video').replace(/[^\w\-ğüşöçıİĞÜŞÖÇ ]+/g, '').trim())}.mp4">Final videoyu indir</a>` : ''}
        ${S.cloud && S.cloud.configured && cloudSession() ? `<button id="cl-push" title="${v.cloudAt ? 'Son bulut kaydı: ' + fmtDate(v.cloudAt) : 'Henüz buluta kaydedilmedi'}">☁ Buluta kaydet${v.cloudAt ? ' <span class="small muted">(' + fmtDate(v.cloudAt) + ')</span>' : ''}</button>` : ''}
        <button class="ghost danger" id="btn-del">Sil</button>
      </div>`;
    const ready = v.shots.filter((s) => s.video).length;
    const steps = [
      ['setup', '1', 'Hazırlık', 'Senaryo, ayarlar, karakterler', v.shots.length > 0],
      ['shots', '2', 'Çekimler', v.shots.length ? ready + '/' + v.shots.length + ' çekim hazır' : 'Plan bekleniyor', v.shots.length > 0 && ready === v.shots.length],
      ['final', '3', 'Final', v.final ? 'Video hazır' : 'Müzik ekle, birleştir, indir', !!v.final],
    ];
    $('v-steps').innerHTML = steps.map(([k, n, l, sub, done]) => `<button class="${S.step === k ? 'on' : ''} ${done ? 'done' : ''}" data-step="${k}" ${k !== 'setup' && !v.shots.length ? 'disabled' : ''}><b>${done && S.step !== k ? '✓' : n}</b><span><span class="st-t">${l}</span><span class="st-s">${esc(sub)}</span></span></button>`).join('');
    $('v-guide').innerHTML = guideHtml(v);
    if (S.step === 'setup') renderSetup(); else if (S.step === 'shots') renderShots(); else renderFinal();
  }

  // --- 2. Çekimler ---
  const thumbClass = () => { const a = (S.video.plan && S.video.plan.aspect) || S.video.aspect; return a === '9:16' ? 'thumb v' : a === '1:1' ? 'thumb sq' : 'thumb'; };
  function renderShots() {
    const v = S.video;
    const warns = (v.plan && v.plan.warnings) || [], qs = (v.plan && v.plan.questions) || [];
    let html = '';
    if (warns.length || qs.length) html += `<details class="warnbox"><summary>${warns.length} uyarı${qs.length ? ', ' + qs.length + ' soru' : ''} (Claude)</summary>${warns.length ? `<ul style="margin:6px 0 0;padding-left:18px">${warns.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}${qs.length ? `<ul style="margin:6px 0 0;padding-left:18px">${qs.map((q) => `<li>${esc(q)}</li>`).join('')}</ul>` : ''}</details>`;
    const est = v.tahmin && v.tahmin.tumunu, hasFlow = v.shots.some((s) => s.tool === 'flow'), anyBusy = v.shots.some((s) => s.busy) || v.producing;

      <div class="row">${hasFlow ? `<a class="btn xs" href="/api/videos/${v.id}/pack">Dış araç paketini indir</a><label class="btn xs">Klipleri toplu yükle<input type="file" accept="video/*,.mp4,.mov,.webm" id="bulk-clips" multiple hidden></label>` : ''}<button class="gold" id="btn-produce" ${anyBusy || missingReason(['gemini']) ? 'disabled' : ''}>Eksik çekimleri üret</button></div></div>`;
    const sections = (v.plan && v.plan.sections) || [];
    const bySection = new Map();
    for (const s of v.shots) { if (!bySection.has(s.section_id)) bySection.set(s.section_id, []); bySection.get(s.section_id).push(s); }
    const ids = [...new Set([...sections.map((s) => s.id), ...bySection.keys()])];
    for (const secId of ids) {
      const sec = sections.find((s) => s.id === secId) || { id: secId, name: 'Bölüm ' + secId };
      const shots = bySection.get(secId) || [];
      html += `<div class="section"><b>${esc(sec.name)}</b><span class="small muted">${shots.length ? fmtT(shots[0].start) + ' – ' + fmtT(shots[shots.length - 1].start + shots[shots.length - 1].duration) : ''}${sec.color_grade && sec.color_grade !== 'none' ? ' · renk: ' + esc(sec.color_note || sec.color_grade) : ''}${sec.music_note ? ' · müzik: ' + esc(sec.music_note) : ''}</span><button class="xs ghost" data-addshot="${secId}" data-after="${shots.length ? shots[shots.length - 1].id : 0}">+ çekim</button></div>`;
      for (const s of shots) html += shotCard(s);

    $('v-body').innerHTML = html;
  }
  function shotCard(s) {

    const media = s.video ? `<video controls playsinline preload="metadata" src="${vFile(s.video, s.videoAt)}#t=0.3"></video>` : s.raw ? `<video controls playsinline preload="metadata" src="${vFile(s.raw, s.rawAt)}#t=0.3"></video>` : s.image ? `<img src="${vFile(s.image, s.imageAt)}" alt="">` : '<span style="padding:10px">Henüz üretilmedi<br><span class="faint">"Üret"e basınca burada görünür</span></span>';
    const stKey = Object.keys(s.tahmin || {}).filter((k) => !((k === 'image' && s.image) || (k === 'audio' && s.audio) || (k === 'voiceover' && s.voFiles && s.voFiles.length) || (k === 'video' && (s.video || s.raw)) || (k === 'fixvoice' && s.video)));
    const estMissing = stepEst(s, stKey), estAll = stepEst(s, Object.keys(s.tahmin || {}));
    const waitingClip = tool === 'flow' && !s.raw && !s.video;
    const draft = S.drafts[s.id] || '';
    const revs = s.revisions || [];
    return `<div class="shot ${busy ? 'busy' : ''} ${s.error ? 'has-err' : ''}" data-shot="${s.id}">

        <div class="row small" style="margin-top:6px;gap:6px">${statusChip(s.status || 'Bekliyor')}${s.manual ? '<span class="chip">klip elle</span>' : ''}${s.imageManual ? '<span class="chip">kare elle</span>' : ''}</div>
        ${s.audio ? `<audio controls preload="none" src="${vFile(s.audio, s.audioAt)}" style="width:100%;height:28px;margin-top:6px"></audio>` : ''}
        ${(s.voFiles || []).map((vo) => `<audio controls preload="none" src="${vFile(vo.file, s.voAt)}" style="width:100%;height:28px;margin-top:6px" title="dış ses"></audio>`).join('')}
      </div>
      <div>
        <div class="head"><b class="num">#${s.id}</b><span>${fmtT(s.start)}</span><span>süre <input type="number" class="sm" data-sf="${s.id}:duration" value="${esc(s.duration)}" step="0.5" min="1" style="width:64px"> sn</span>${toolSelect(`data-sf="${s.id}:tool"`, tool)}${s.camera ? `<span class="faint">${esc(s.camera)}</span>` : ''}</div>
        <input type="text" class="sm" data-sf="${s.id}:description" value="${esc(s.description)}" style="margin-top:8px">
        <div class="small muted" style="margin-top:4px">${esc(s.tool_reason)}${s.characters && s.characters.length ? ' · ' + esc(s.characters.join(', ')) : ''}${s.location ? ' · ' + esc(s.location) : ''}</div>
        <div class="lines">${lines.join('')}</div>
        ${s.error ? `<div class="err mt">${esc(s.error)}</div>` : ''}

        ${waitingClip && s.image ? `<div class="row mt small"><span class="muted">Dış araç:</span><a class="btn xs" href="${vFile(s.image, s.imageAt, true)}" download="cekim-${nn(s.id)}.jpg">Görseli indir</a><button class="xs" data-copy="${s.id}">Promptu kopyala</button><a href="https://labs.google/fx/tools/flow" target="_blank" rel="noopener">Flow</a><a href="https://app.klingai.com" target="_blank" rel="noopener">Kling</a><a href="https://app.runwayml.com" target="_blank" rel="noopener">Runway</a><span class="faint">klibi cekim-${nn(s.id)}.mp4 adıyla kaydedip yükleyin</span></div>` : ''}
        <div class="row mt" style="gap:12px"><button class="xs ghost" data-adv="${s.id}">${open ? 'Gelişmiş ayarları gizle ▴' : 'Gelişmiş ayarlar ▾'}</button><button class="xs ghost danger" data-sdel="${s.id}">Çekimi sil</button></div>

          ${revs.length ? `<div class="small" style="margin-top:6px;opacity:.8">${revs.map((r) => `<div>• <b>${esc(r.note)}</b>${r.answer ? ` <span class="faint">→ ${esc(r.answer)}</span>` : ''}</div>`).join('')}</div>` : ''}
        </div>

        <div class="full"><label class="f">Görsel promptu (ilk kare) · karakter ve mekân tarifleri üretimde otomatik eklenir</label><textarea class="sm" data-sf="${s.id}:image_prompt">${esc(s.image_prompt)}</textarea></div>
        ${tool !== 'avatar' && tool !== 'text_card' ? `<div class="full"><label class="f">Video promptu</label><textarea class="sm" data-sf="${s.id}:video_prompt">${esc(s.video_prompt)}</textarea></div>` : ''}
        ${s.video_prompt_soft && s.video_prompt_soft_for === s.video_prompt ? `<div class="full"><label class="f">Yumuşatılmış prompt (Gemini filtresi için, otomatik)</label><div class="sm" style="white-space:pre-wrap;opacity:.75">${esc(s.video_prompt_soft)}</div></div>` : ''}
        ${tool === 'avatar' ? `<div class="full"><label class="f">Hareket promptu (isteğe bağlı)</label><input type="text" class="sm" data-sf="${s.id}:motion_prompt" value="${esc(s.motion_prompt || '')}"></div>` : ''}
        <div><label class="f">Karakterler (virgülle, kütüphane adları)</label><input type="text" class="sm" data-sf="${s.id}:characters" value="${esc((s.characters || []).join(', '))}"></div>
